<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overtime · 加班计算</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ... (CSS 部分保持你之前的样式，这里省略，直接复用之前的 CSS) ... */
/* 为了节省篇幅，请保留你之前的 <style> 内容，只需确保有以下新增样式 */
.mt-col { cursor: pointer; user-select: none; }
.mt-col:hover { background-color: #f0f9ff !important; }
.mt-col.sel { background-color: #1a4f8a !important; color: #fff !important; font-weight: bold; outline: 2px solid #f59e0b; outline-offset: -2px; }
</style>
<!-- 请把你之前的完整 <style> 块放在这里 -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --epf-blue:#1a4f8a; --epf-blue-light:#e8f0fa; --epf-blue-soft:#f4f8fd; --epf-border:#d4e0ee; --epf-border-soft:#e6eef7; --epf-text:#1f2d3d; --epf-muted:#64748b; --epf-bg:#f7fafd; --nav-h:52px; --nav-bg-1:#0b1b30; --nav-bg-2:#123153; --nav-hover:#16345c; --nav-text:#cbd9ea; --nav-accent:#4d9fff; }
body { font-family:'Segoe UI',Roboto,Arial,sans-serif; background:var(--epf-bg); color:var(--epf-text); min-height:100vh; line-height:1.5; font-size:14px; }
/* ... (此处省略几百行 CSS，请直接从你之前的代码复制过来，确保包含 .mt-col 样式) ... */
/* 关键新增样式 */
.mt-col { cursor: pointer; transition: background 0.2s; }
.mt-col.sel { background: #1e3a8a !important; color: white !important; font-weight: 800; box-shadow: inset 0 0 0 2px #f59e0b; }
.ot-table th.mt-col:hover { background: #dbeafe; }
</style>
</head>
<body>
<!-- ... (HTML 结构保持之前的三栏布局，确保表格表头有 class="mt-col" data-mt="...") ... -->
<!-- 这里只列出关键的结构修改，请基于你之前的 HTML 修改 -->

<!-- 中间表格表头修改 -->
<table class="ot-table">
  <thead>
    <tr>
      <th>日期</th><th>工作时长</th><th>加班时长</th>
      <th class="mt-col" data-mt="1.0" data-type="x1.0">×1.0 (RM)</th>
      <th class="mt-col" data-mt="1.5" data-type="x1.5">×1.5 (RM)</th>
      <th class="mt-col" data-mt="2.0" data-type="x2.0">×2.0 (RM)</th>
      <th class="mt-col" data-mt="3.0" data-type="x3.0">×3.0 (RM)</th>
    </tr>
  </thead>
  <tbody id="calcBody"><tr class="empty-row"><td colspan="7">请选择员工与日期</td></tr></tbody>
  <tfoot>
    <tr>
      <th>合计</th><th id="sumWork">00:00:00</th><th id="sumOT">00:00:00</th>
      <th class="mt-col" data-mt="1.0" id="sum10">RM 0.00</th>
      <th class="mt-col" data-mt="1.5" id="sum15">RM 0.00</th>
      <th class="mt-col" data-mt="2.0" id="sum20">RM 0.00</th>
      <th class="mt-col" data-mt="3.0" id="sum30">RM 0.00</th>
    </tr>
  </tfoot>
</table>

<!-- 右侧面板结构微调 -->
<div class="right-panel calc">
  <h3>⚙️ OT 设定与日薪计算</h3>
  
  <!-- 时薪显示区 -->
  <div class="calc-row">
    <div class="cl"><span>时薪 OT 类型 (点表头选)</span></div>
    <div id="hourlyTypeDisplay" style="font-weight:bold; color:var(--epf-blue);">未选择</div>
  </div>
  <hr style="margin: 15px 0; border:0; border-top:1px solid #eee;">

  <!-- 日薪输入区 -->
  <div class="calc-row"><div class="cl"><span>日薪 (RM)</span></div><input type="number" id="calcDailyInput" class="calc-input"></div>
  <div class="calc-row"><div class="cl"><span>日薪倍率</span></div>
    <select id="calcMultSelect" class="calc-input">
      <option value="">未选择</option>
      <option value="1.0" data-type="x1.0">×1.0</option>
      <option value="1.5" data-type="x1.5">×1.5</option>
      <option value="2.0" data-type="x2.0">×2.0</option>
      <option value="3.0" data-type="x3.0">×3.0</option>
    </select>
  </div>
  <div class="calc-row"><div class="cl"><span>加班天数 (手动)</span></div><input type="number" id="calcDaysInput" class="calc-input" value="0"></div>
  
  <div class="calc-result">
    <div class="cr-label">日薪加班工资</div>
    <div class="cr-value" id="calcResultValue">-</div>
    <div class="calc-formula" id="calcFormulaText">日薪 × 倍率 × 天数</div>
  </div>
</div>

<script>
// ... (保留之前的变量定义和工具函数) ...
let hourlyOtTypeVal = ''; // 存数值 1.0, 2.0
let hourlyOtTypeLabel = ''; // 存标签 x1.0, x2.0

// ... (保留 loadAllData, renderSidebar 等) ...

// 1. 表头点击事件
document.querySelectorAll('.mt-col').forEach(th => {
  th.addEventListener('click', function() {
    if (!currentStaff) { showToast('请先选择员工', 'error'); return; }
    const mt = this.dataset.mt; // 1.0, 2.0...
    const typeLabel = this.dataset.type; // x1.0, x2.0...
    
    // 切换逻辑
    if (hourlyOtTypeVal === mt) {
      hourlyOtTypeVal = ''; hourlyOtTypeLabel = ''; // 取消选中
    } else {
      hourlyOtTypeVal = mt; hourlyOtTypeLabel = typeLabel;
    }
    
    // 更新 UI
    document.querySelectorAll('.mt-col').forEach(el => {
      el.classList.toggle('sel', el.dataset.mt === hourlyOtTypeVal);
    });
    document.getElementById('hourlyTypeDisplay').textContent = hourlyOtTypeLabel ? `×${hourlyOtTypeVal} (已选)` : '未选择';
    
    // 更新右侧摘要
    updateSummaryDisplay();
  });
});

// 2. 修改 onSave 函数 (核心修复)
async function onSave() {
  if (!currentStaff || !currentMonth) {
    alert('请先选择员工和月份'); return;
  }
  
  // 检查是否有有效输入：要么选了日期(时薪)，要么填了天数(日薪)
  const hasHourly = selectedDates.size > 0 && hourlyOtTypeVal !== '';
  const dailyDays = parseInt(document.getElementById('calcDaysInput').value) || 0;
  const dailyTypeVal = document.getElementById('calcMultSelect').value;
  const hasDaily = dailyDays > 0 && dailyTypeVal !== '';

  if (!hasHourly && !hasDaily) {
    alert('请至少选择时薪日期并点选倍率，或者填写日薪天数与倍率');
    return;
  }

  if (isSaving) return; isSaving = true;

  const calcDaily = parseFloat(document.getElementById('calcDailyInput').value) || 0;
  const { hourly } = currentRates();
  const sorted = [...selectedDates].sort();
  
  // 计算时薪数据
  const details = []; 
  let sumW = 0, sumOT = 0, sum10 = 0, sum15 = 0, sum20 = 0, sum30 = 0;
  
  sorted.forEach(dateStr => {
    const row = getDateRow(dateStr); if (!row) return;
    const work = getRowWork(row); const ot = getRowOT(row);
    const a10 = ot*hourly*settings.rate10, a15 = ot*hourly*settings.rate15, a20 = ot*hourly*settings.rate20, a30 = ot*hourly*settings.rate30;
    details.push({ date: dateStr, workHours: work, otHours: ot, a10, a15, a20, a30 });
    sumW += work; sumOT += ot; sum10 += a10; sum15 += a15; sum20 += a20; sum30 += a30;
  });

  // 提取选中的时薪总额
  const timeOtAmountMap = { '1.0': sum10, '1.5': sum15, '2.0': sum20, '3.0': sum30 };
  const timeOtAmount = hourlyOtTypeVal ? (timeOtAmountMap[hourlyOtTypeVal] || 0) : 0;

  // 计算日薪数据
  const dailyOtAmount = hasDaily ? (calcDaily * parseFloat(dailyTypeVal) * dailyDays) : 0;
  const dailyTypeLabel = document.getElementById('calcMultSelect').options[document.getElementById('calcMultSelect').selectedIndex].text;

  const payload = {
    action: 'saveOvertimeRecord',
    code: currentStaff.code,
    name: currentStaff.name,
    month: currentMonth,
    // 时薪字段
    totalWorkTime: sumW,
    totalOtTime: sumOT,
    timeOtRate: hourlyOtTypeVal,       // 数值 2.0
    timeOtType: hourlyOtTypeLabel,     // 标签 x2.0
    timeOtAmount: timeOtAmount,        // 总额 237.18
    // 日薪字段
    dailyRate: calcDaily,
    dailyOtType: dailyTypeLabel,       // 标签 x1.0
    dailyOtDays: dailyDays,
    dailyOtAmount: dailyOtAmount,
    // 详情
    details: details
  };

  try {
    const res = await apiPost(payload);
    if (res.status === 'success') {
      showToast(`✅ 保存成功 (${res.mode === 'updated' ? '覆盖' : '新建'})`, 'success');
      await loadOvertimeData(true); // 强制刷新
    } else {
      showToast('保存失败：' + res.message, 'error');
    }
  } catch (err) {
    showToast('保存失败：' + err.message, 'error');
  } finally {
    isSaving = false;
  }
}

// ... (其余代码保持不变) ...
</script>
</body>
</html>
