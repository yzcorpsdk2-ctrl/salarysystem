<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Public Holidays · 公共假期设置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
/* ============================================================
   复用 Dashboard 样式变量
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --epf-blue: #1a4f8a; --epf-blue-light: #e8f0fa; --epf-blue-soft: #f4f8fd;
  --epf-border: #d4e0ee; --epf-border-soft: #e6eef7;
  --epf-text: #1f2d3d; --epf-muted: #64748b; --epf-bg: #f7fafd;

  --nav-h: 52px;
  --nav-bg-1: #0b1b30; --nav-bg-2: #123153; --nav-hover: #16345c;
  --nav-text: #cbd9ea; --nav-accent: #4d9fff;
  
  --shadow-sm: 0 1px 2px rgba(16,32,56,.05), 0 2px 10px rgba(16,32,56,.05);
  --shadow-md: 0 8px 24px rgba(16,32,56,.10);
  
  --holiday-color: #ef4444; /* 假日标记颜色 */
  --holiday-bg: #fef2f2;
}

body {
  font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--epf-bg); color: var(--epf-text);
  min-height: 100vh; line-height: 1.5; font-size: 14px;
  display: flex; flex-direction: column;
}

/* ================= NAVBAR (完全复用) ================= */
.navbar {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: stretch; flex-wrap: wrap;
  background: linear-gradient(90deg, var(--nav-bg-1) 0%, var(--nav-bg-2) 100%);
  padding: 0 1rem; min-height: var(--nav-h);
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  border-bottom: 1px solid rgba(77,159,255,0.18);
}
.navbar .nav-brand {
  display: flex; align-items: center; gap: 0.55rem;
  color: #fff; font-weight: 800; font-size: 0.78rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding-right: 1.1rem; margin-right: 0.5rem;
  border-right: 1px solid rgba(255,255,255,0.12);
}
.navbar .nav-brand .logo {
  width: 28px; height: 28px; border-radius: 7px;
  background: linear-gradient(135deg, #4d9fff, #1a4f8a);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 0.85rem; font-weight: 800;
}
.nav-links { display: flex; align-items: stretch; flex-wrap: wrap; gap: 2px; position: relative; }
.nav-item {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0 0.85rem; min-height: var(--nav-h);
  color: var(--nav-text); text-decoration: none;
  font-family: inherit; font-size: 0.73rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: transparent; border: none; cursor: pointer;
  white-space: nowrap; transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-item:hover, .nav-item.active { background: var(--nav-hover); color: #fff; }
.nav-item::after {
  content: ''; position: absolute; left: 0.85rem; right: 0.85rem; bottom: 0;
  height: 2px; background: var(--nav-accent); transform: scaleX(0);
  transform-origin: left; transition: transform 0.2s;
}
.nav-item:hover::after, .nav-item.active::after { transform: scaleX(1); }
.nav-dropdown { position: relative; display: inline-flex; align-items: stretch; }
.dropdown-menu {
  display: none; position: absolute; top: 100%; left: 0;
  min-width: 180px; background: #ffffff;
  border-radius: 8px; box-shadow: var(--shadow-md);
  padding: 0.4rem 0; z-index: 300; border: 1px solid var(--epf-border);
}
.nav-dropdown.open .dropdown-menu { display: block; }
.dropdown-menu a {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
  color: var(--epf-text); text-decoration: none; font-size: 0.78rem;
  font-weight: 500; transition: background 0.12s;
}
.dropdown-menu a:hover { background: var(--epf-blue-soft); color: var(--epf-blue); }

/* ================= MAIN CONTENT ================= */
.main-container {
  max-width: 1200px;
  margin: 1.5rem auto;
  padding: 0 1.5rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.header-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  padding: 1rem 1.5rem;
  border-radius: 10px;
  border: 1px solid var(--epf-border);
  box-shadow: var(--shadow-sm);
}
.header-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--epf-blue);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.header-stats {
  font-size: 0.85rem;
  color: var(--epf-muted);
}
.header-stats strong {
  color: var(--epf-blue);
  font-size: 1.1rem;
}

/* ================= CALENDAR GRID ================= */
.calendar-wrapper {
  background: #fff;
  border: 1px solid var(--epf-border);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--epf-border);
  background: var(--epf-blue-soft);
}
.cal-nav-btn {
  background: #fff;
  border: 1px solid var(--epf-border);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--epf-blue);
  transition: 0.2s;
}
.cal-nav-btn:hover {
  background: var(--epf-blue);
  color: #fff;
  border-color: var(--epf-blue);
}
.current-month-label {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--epf-text);
  min-width: 150px;
  text-align: center;
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background: #f8fafc;
  border-bottom: 1px solid var(--epf-border);
}
.weekday {
  padding: 0.8rem;
  text-align: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--epf-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  /* 自动填充高度，确保格子方正 */
  grid-auto-rows: minmax(100px, 1fr); 
  background: #fff;
}

.day-cell {
  border-right: 1px solid var(--epf-border-soft);
  border-bottom: 1px solid var(--epf-border-soft);
  padding: 0.5rem;
  position: relative;
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.day-cell:nth-child(7n) { border-right: none; } /* 移除右边框 */
.day-cell:hover { background: var(--epf-blue-soft); }
.day-cell.empty { background: #fcfcfc; cursor: default; }
.day-cell.empty:hover { background: #fcfcfc; }

.day-number {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--epf-text);
  align-self: flex-start;
}
.day-cell.today .day-number {
  background: var(--epf-blue);
  color: #fff;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
}

/* 假日标记 */
.holiday-marker {
  font-size: 0.7rem;
  background: var(--holiday-bg);
  color: var(--holiday-color);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #fecaca;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
.holiday-marker i { font-size: 0.6rem; }

/* ================= MODAL (弹窗) ================= */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; animation: fadeIn 0.2s; }

.modal-card {
  background: #fff;
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  padding: 1.5rem;
  position: relative;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.2rem;
}
.modal-title { font-size: 1.1rem; font-weight: 800; color: var(--epf-blue); }
.close-btn {
  background: none; border: none; font-size: 1.2rem;
  color: var(--epf-muted); cursor: pointer;
}

.form-group { margin-bottom: 1rem; }
.form-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--epf-muted);
  margin-bottom: 0.4rem;
  text-transform: uppercase;
}
.form-input {
  width: 100%;
  padding: 0.6rem;
  border: 1px solid var(--epf-border);
  border-radius: 6px;
  font-size: 0.9rem;
  font-family: inherit;
  color: var(--epf-text);
}
.form-input:focus { outline: none; border-color: var(--epf-blue); box-shadow: 0 0 0 2px rgba(26,79,138,0.1); }

.multiplier-select {
  display: flex;
  gap: 0.5rem;
}
.mult-option {
  flex: 1;
  padding: 0.5rem;
  text-align: center;
  border: 1px solid var(--epf-border);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--epf-muted);
  transition: 0.15s;
}
.mult-option:hover { border-color: var(--epf-blue); color: var(--epf-blue); }
.mult-option.active {
  background: var(--epf-blue);
  color: #fff;
  border-color: var(--epf-blue);
}

.modal-actions {
  display: flex;
  gap: 0.8rem;
  margin-top: 1.5rem;
}
.btn {
  flex: 1;
  padding: 0.6rem;
  border-radius: 6px;
  border: none;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}
.btn-primary { background: var(--epf-blue); color: #fff; }
.btn-primary:hover { background: #15406f; }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn-danger:hover { background: #fecaca; }
.btn-secondary { background: #f1f5f9; color: var(--epf-muted); }
.btn-secondary:hover { background: #e2e8f0; }

/* Loading Spinner */
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Toast Notification */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1f2d3d; color: #fff;
  padding: 0.8rem 1.2rem;
  border-radius: 8px;
  box-shadow: var(--shadow-md);
  font-size: 0.85rem;
  font-weight: 600;
  transform: translateY(100px);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.toast.show { transform: translateY(0); }
.toast.success { border-left: 4px solid #22c55e; }
.toast.error { border-left: 4px solid #ef4444; }

@media (max-width: 768px) {
  .main-container { padding: 1rem; }
  .header-section { flex-direction: column; gap: 0.5rem; text-align: center; }
  .days-grid { grid-auto-rows: 80px; }
  .holiday-marker { font-size: 0.6rem; padding: 1px 4px; }
}
</style>
</head>
<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-brand"><span class="logo">Y</span><span class="brand-text">YZ Payroll</span></div>
  <div class="nav-links">
    <div class="nav-dropdown">
      <button class="nav-item" onclick="window.location.href='dashboard.html'">
        <i class="fas fa-arrow-left"></i> BACK
      </button>
    </div>
    <a class="nav-item active" href="public.html">PUBLIC HOLIDAYS</a>
    <div class="nav-dropdown" id="settingsDropdown">
      <button class="nav-item">SETTINGS <i class="fas fa-caret-down"></i></button>
      <div class="dropdown-menu">
        <a href="companysetting.html">⚙️ Company Setting</a>
        <a href="public.html">📰 Public Days</a>
      </div>
    </div>
  </div>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<div class="main-container">
  
  <!-- Header Info -->
  <div class="header-section">
    <div class="header-title">
      <i class="fas fa-calendar-alt"></i>
      <span>公共假期管理 (Public Holidays)</span>
    </div>
    <div class="header-stats">
      已设置: <strong id="holidayCount">0</strong> / 25 天
    </div>
  </div>

  <!-- Calendar Widget -->
  <div class="calendar-wrapper">
    <div class="calendar-header">
      <button class="cal-nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
      <div class="current-month-label" id="monthLabel">Loading...</div>
      <button class="cal-nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
    </div>
    
    <div class="weekdays">
      <div class="weekday">Sun</div>
      <div class="weekday">Mon</div>
      <div class="weekday">Tue</div>
      <div class="weekday">Wed</div>
      <div class="weekday">Thu</div>
      <div class="weekday">Fri</div>
      <div class="weekday">Sat</div>
    </div>
    
    <div class="days-grid" id="daysGrid">
      <!-- Days will be injected by JS -->
      <div style="grid-column: 1/-1; text-align:center; padding: 2rem; color: #94a3b8;">
        <span class="spinner" style="border-color: #cbd5e1; border-top-color: var(--epf-blue);"></span> 加载日历数据中...
      </div>
    </div>
  </div>

</div>

<!-- ================= MODAL FOR ADDING/EDITING ================= -->
<div class="modal-overlay" id="holidayModal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">设置假日</div>
      <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    
    <div class="form-group">
      <label class="form-label">日期 (Date)</label>
      <input type="text" class="form-input" id="modalDateDisplay" disabled style="background:#f8fafc;">
      <input type="hidden" id="modalDateValue">
    </div>
    
    <div class="form-group">
      <label class="form-label">假日名称 (Name)</label>
      <input type="text" class="form-input" id="modalName" placeholder="例如: Hari Raya, CNY..." maxlength="30">
    </div>
    
    <div class="form-group">
      <label class="form-label">薪资倍数 (Multiplier)</label>
      <div class="multiplier-select" id="multSelect">
        <div class="mult-option" data-val="1">1.0x</div>
        <div class="mult-option active" data-val="3">3.0x</div>
        <div class="mult-option" data-val="2">2.0x</div>
      </div>
      <div style="font-size: 0.7rem; color: var(--epf-muted); margin-top: 4px;">
        * 默认公假补贴为 3 倍薪资
      </div>
    </div>
    
    <div class="modal-actions">
      <button class="btn btn-danger" id="btnDelete" onclick="deleteHoliday()" style="display:none;">
        <i class="fas fa-trash"></i> 删除
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveHolidayFromModal()">
        <i class="fas fa-save"></i> 保存
      </button>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   State & Config
   ============================================================ */
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-11
let holidays = []; // Array of {date: "YYYY-MM-DD", name: string, multiplier: number}
let selectedDateStr = null;

const MAX_HOLIDAYS = 25;

/* ============================================================
   Initialization
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  initNavbar();
  loadHolidays();
  
  // Calendar Navigation
  document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
  
  // Multiplier Selection
  document.querySelectorAll('.mult-option').forEach(opt => {
    opt.addEventListener('click', function() {
      document.querySelectorAll('.mult-option').forEach(o => o.classList.remove('active'));
      this.classList.add('active');
    });
  });
});

function initNavbar() {
  const dropdowns = document.querySelectorAll('.nav-dropdown');
  dropdowns.forEach(dd => {
    dd.addEventListener('click', (e) => {
      e.stopPropagation();
      dd.classList.toggle('open');
    });
  });
  document.addEventListener('click', () => {
    dropdowns.forEach(dd => dd.classList.remove('open'));
  });
}

/* ============================================================
   Data Loading
   ============================================================ */
function loadHolidays() {
  google.script.run
    .withSuccessHandler(data => {
      holidays = data || [];
      renderCalendar();
      updateCount();
    })
    .withFailureHandler(err => {
      showToast('加载失败: ' + err.message, 'error');
      document.getElementById('daysGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:red">Error loading data</div>';
    })
    .getPublicHolidays();
}

function updateCount() {
  document.getElementById('holidayCount').textContent = holidays.length;
  if (holidays.length >= MAX_HOLIDAYS) {
    document.getElementById('holidayCount').style.color = '#ef4444';
  } else {
    document.getElementById('holidayCount').style.color = 'var(--epf-blue)';
  }
}

/* ============================================================
   Calendar Rendering
   ============================================================ */
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  } else if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar();
}

function renderCalendar() {
  const grid = document.getElementById('daysGrid');
  const label = document.getElementById('monthLabel');
  
  // Update Label
  const monthNames = ["January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"];
  label.textContent = `${monthNames[currentMonth]} ${currentYear}`;
  
  grid.innerHTML = '';
  
  // First day of month
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  // Days in month
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  
  // Empty cells for previous month
  for (let i = 0; i < firstDay; i++) {
    const emptyCell = document.createElement('div');
    emptyCell.className = 'day-cell empty';
    grid.appendChild(emptyCell);
  }
  
  // Day cells
  const today = new Date();
  const isCurrentMonth = today.getFullYear() === currentYear && today.getMonth() === currentMonth;
  
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    
    // Highlight Today
    if (isCurrentMonth && d === today.getDate()) {
      cell.classList.add('today');
    }
    
    // Check for Holiday
    const holiday = holidays.find(h => h.date === dateStr);
    
    let content = `<div class="day-number">${d}</div>`;
    if (holiday) {
      content += `
        <div class="holiday-marker">
          <i class="fas fa-star"></i> ${escapeHtml(holiday.name)}
        </div>
      `;
      cell.style.background = '#fff1f2'; // Light red bg for holiday
      cell.style.borderColor = '#fecaca';
    }
    
    cell.innerHTML = content;
    cell.onclick = () => openModal(dateStr, holiday);
    grid.appendChild(cell);
  }
}

/* ============================================================
   Modal Logic
   ============================================================ */
function openModal(dateStr, existingHoliday) {
  selectedDateStr = dateStr;
  const modal = document.getElementById('holidayModal');
  const title = document.getElementById('modalTitle');
  const dateDisplay = document.getElementById('modalDateDisplay');
  const dateValue = document.getElementById('modalDateValue');
  const nameInput = document.getElementById('modalName');
  const deleteBtn = document.getElementById('btnDelete');
  
  // Format date for display
  const d = new Date(dateStr);
  dateDisplay.value = d.toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  dateValue.value = dateStr;
  
  if (existingHoliday) {
    title.textContent = '编辑假日 (Edit Holiday)';
    nameInput.value = existingHoliday.name;
    setMultiplier(existingHoliday.multiplier);
    deleteBtn.style.display = 'flex';
  } else {
    title.textContent = '新增假日 (Add Holiday)';
    nameInput.value = '';
    setMultiplier(3); // Default to 3x
    deleteBtn.style.display = 'none';
  }
  
  modal.classList.add('open');
  nameInput.focus();
}

function closeModal() {
  document.getElementById('holidayModal').classList.remove('open');
  selectedDateStr = null;
}

function setMultiplier(val) {
  document.querySelectorAll('.mult-option').forEach(opt => {
    if (parseFloat(opt.dataset.val) === val) opt.classList.add('active');
    else opt.classList.remove('active');
  });
}

function getSelectedMultiplier() {
  const active = document.querySelector('.mult-option.active');
  return active ? parseFloat(active.dataset.val) : 3;
}

/* ============================================================
   Save & Delete Logic
   ============================================================ */
function saveHolidayFromModal() {
  const name = document.getElementById('modalName').value.trim();
  if (!name) {
    showToast('请输入假日名称', 'error');
    return;
  }
  
  // Check limit if adding new
  const isEdit = holidays.some(h => h.date === selectedDateStr);
  if (!isEdit && holidays.length >= MAX_HOLIDAYS) {
    showToast(`最多只能设置 ${MAX_HOLIDAYS} 天公假`, 'error');
    return;
  }
  
  const multiplier = getSelectedMultiplier();
  
  // Update local array
  if (isEdit) {
    const idx = holidays.findIndex(h => h.date === selectedDateStr);
    holidays[idx] = { date: selectedDateStr, name, multiplier };
  } else {
    holidays.push({ date: selectedDateStr, name, multiplier });
  }
  
  // Send to backend
  const btn = document.querySelector('.btn-primary');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> Saving...';
  btn.disabled = true;
  
  google.script.run
    .withSuccessHandler(res => {
      btn.innerHTML = originalText;
      btn.disabled = false;
      closeModal();
      renderCalendar();
      updateCount();
      showToast('保存成功！', 'success');
    })
    .withFailureHandler(err => {
      btn.innerHTML = originalText;
      btn.disabled = false;
      showToast('保存失败: ' + err.message, 'error');
    })
    .savePublicHolidays(holidays);
}

function deleteHoliday() {
  if (!confirm('确定要删除这个假日吗？')) return;
  
  holidays = holidays.filter(h => h.date !== selectedDateStr);
  
  google.script.run
    .withSuccessHandler(() => {
      closeModal();
      renderCalendar();
      updateCount();
      showToast('已删除', 'success');
    })
    .savePublicHolidays(holidays);
}

/* ============================================================
   Utilities
   ============================================================ */
function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/[&<>"']/g, function(m) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[m];
  });
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => {
    toast.classList.remove('show');
  }, 3000);
}
</script>
