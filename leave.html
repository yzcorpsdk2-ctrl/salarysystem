<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timecard Report · 演算SHEET</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            background: linear-gradient(160deg, #eef2f7 0%, #e6ecf5 40%, #f3f6fb 100%);
            color: #1e293b;
            padding: 20px 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10), 0 2px 8px rgba(15,23,42,0.04);
            border: 1px solid rgba(255,255,255,0.7);
            padding: 0 0 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        /* ===== 品牌栏 ===== */
        .brandbar {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 24px;
            background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
            color: #fff;
            flex-shrink: 0;
        }
        .brandbar .logo {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; font-weight: 700;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
            flex-shrink: 0;
        }
        .brandbar .titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
        .brandbar .titles .kicker {
            font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
            color: rgba(255,255,255,0.72); font-weight: 600;
        }
        .brandbar .titles h1 {
            font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .brandbar .titles h1 small {
            font-size: 11px; font-weight: 500;
            background: rgba(255,255,255,0.18);
            color: #fff; padding: 3px 10px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .brandbar .spacer { flex: 1; }
        .brandbar .stat-pill {
            display: inline-flex; align-items: center; gap: 7px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 13px; border-radius: 30px;
            font-size: 12px; font-weight: 500;
            color: #f8fafc;
            white-space: nowrap;
        }
        .brandbar .stat-pill b { font-weight: 700; color: #fff; }
        .brandbar .stat-pill .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,0.25);
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
            margin: 14px 24px 0;
            padding: 11px 14px;
            background: #ffffff;
            border: 1px solid #e6ebf3;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(15,23,42,0.05);
            flex-shrink: 0;
        }
        .toolbar button, .toolbar label.file-label {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; font-size: 12.5px; font-weight: 600;
            border-radius: 9px; border: 1px solid #dbe2ee;
            background: #ffffff; color: #1e293b;
            cursor: pointer; transition: all 0.18s; white-space: nowrap;
        }
        .toolbar button:hover, .toolbar label.file-label:hover {
            background: #f6f9ff; border-color: #93b4f5; transform: translateY(-1px);
        }
        .toolbar button.primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-color: transparent; color: #ffffff;
            box-shadow: 0 4px 12px rgba(37,99,235,0.28);
        }
        .toolbar button.primary:hover { filter: brightness(1.06); }
        .toolbar button.template {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: transparent; color: #ffffff;
            box-shadow: 0 4px 12px rgba(16,185,129,0.25);
        }
        .toolbar button.template:hover { filter: brightness(1.06); }
        .toolbar button.danger { border-color: #fecaca; color: #dc2626; background:#fff; }
        .toolbar button.danger:hover { background: #fef2f2; border-color: #f87171; }
        .toolbar .spacer { flex: 1; }
        input[type="file"] { display: none; }

        /* ===== 表格容器：固定高度，内部滚动 ===== */
        .table-wrap {
            margin: 14px 24px 0;
            flex: 1;
            min-height: 0;
            overflow: auto;
            border-radius: 14px;
            border: 1px solid #e6ebf3;
            background: #ffffff;
            box-shadow: 0 6px 22px rgba(15,23,42,0.05);
            position: relative;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            table-layout: fixed;
        }

        thead th {
            padding: 7px 4px; font-weight: 600; font-size: 10px;
            text-transform: uppercase; letter-spacing: 0.3px;
            color: #475569; text-align: center; white-space: nowrap;
            border-right: 1px solid #e9eef4; border-bottom: 2px solid #e2e8f0;
            position: sticky; top: 0; background: #f8fafc; z-index: 3;
            overflow: visible;
        }
        thead th:first-child { text-align: left; padding-left: 10px; }
        thead th:last-child { border-right: none; }
        thead th .sub {
            display: block; font-weight: 500; font-size: 8.5px;
            color: #94a3b8; text-transform: none; letter-spacing: 0;
            margin-top: 1px;
        }
        thead th .th-inner {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            position: relative;
        }
        thead th:first-child .th-inner { justify-content: flex-start; }
        .filter-btn {
            border: none; background: transparent; cursor: pointer;
            font-size: 9px; color: #94a3b8; padding: 1px 2px;
            border-radius: 4px; line-height: 1;
            transition: all 0.15s;
        }
        .filter-btn:hover { background: #e2e8f0; color: #2563eb; }
        .filter-btn.active { color: #2563eb; background: #dbeafe; }

        tbody td {
            padding: 4px 3px; border-bottom: 1px solid #f1f5f9;
            border-right: 1px solid #f4f7fb; text-align: center;
            vertical-align: middle; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            height: 34px;
        }
        tbody td:first-child {
            text-align: left; padding-left: 10px; font-weight: 600;
            color: #94a3b8; font-size: 11px;
        }
        tbody td:last-child { border-right: none; }
        tbody tr:nth-child(even) { background: #fbfcfe; }
        tbody tr:hover { background: #eef4ff; }

        /* ===== 输入控件（压缩以适配桌面全宽） ===== */
        .time-input {
            width: 100%; max-width: 58px; padding: 4px 2px; font-size: 11px;
            text-align: center; border: 1px solid transparent; border-radius: 6px;
            background: transparent; font-family: 'Inter', monospace;
            transition: all 0.15s; color: #0f172a;
        }
        .time-input:hover { border-color: #cbd5e1; background: #fff; }
        .time-input:focus {
            outline: none; border-color: #2563eb; background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
        }
        .time-input::placeholder { color: #cbd5e1; font-size: 10px; }

        .text-input {
            width: 100%; padding: 4px 5px; font-size: 11px; text-align: left;
            border: 1px solid transparent; border-radius: 6px;
            background: transparent; transition: all 0.15s; color: #0f172a;
        }
        .text-input:hover { border-color: #cbd5e1; background: #fff; }
        .text-input:focus {
            outline: none; border-color: #2563eb; background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
        }
        .text-input.id { font-weight: 600; }
        .text-input.center { text-align: center; }

        .status-select {
            width: 100%; padding: 4px 4px; font-size: 10.5px; font-weight: 600;
            border-radius: 6px; border: 1px solid #dbe2ee;
            background: #ffffff; color: #1e293b; cursor: pointer;
            transition: all 0.15s;
        }
        .status-select:hover { border-color: #93b4f5; }
        .status-select:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
        }
        .status-select[data-status="AL"]  { background:#fef9c3; border-color:#fde047; color:#854d0e; }
        .status-select[data-status="SL"]  { background:#ffedd5; border-color:#fdba74; color:#9a3412; }
        .status-select[data-status="UL"]  { background:#fecaca; border-color:#f87171; color:#991b1b; }
        .status-select[data-status="HAL"] { background:#e0f2fe; border-color:#7dd3fc; color:#075985; }
        .status-select[data-status="L"]   { background:#f3e8ff; border-color:#d8b4fe; color:#6b21a8; }
        .status-select[data-status="OFF"] { background:#f1f5f9; border-color:#cbd5e1; color:#64748b; }

        /* ===== 计算列 ===== */
        td.calc-cell {
            font-weight: 700; color: #0f172a; font-size: 11.5px;
            background: #f6f9ff;
        }
        td.calc-cell.seg { font-weight: 600; color: #2563eb; background: #f3f7ff; }
        td.calc-cell.break { color: #0369a1; background: #f0f7ff; }
        td.calc-cell.ot { color: #d97706; }
        td.calc-cell.absent { color: #dc2626; }

        tbody tr.row-overtime { background: #fffbeb !important; }
        tbody tr.row-absent { background: #fef2f2 !important; }

        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state p { margin-top: 8px; font-size: 14px; }

        /* ===== 表尾合计：固定在底部 ===== */
        tfoot {
            background: linear-gradient(180deg,#f8fafc,#eef2f8);
            border-top: 2px solid #e2e8f0;
            position: sticky; bottom: 0; z-index: 3;
        }
        tfoot td {
            padding: 9px 3px; font-size: 11.5px; color: #0f172a;
            text-align: center; border-right: 1px solid #e9eef4; font-weight: 700;
            background: #eef2f8;
        }
        tfoot td:first-child { text-align: right; padding-right: 8px; background: #eef2f8; }
        tfoot td:last-child { border-right: none; }
        tfoot .total-label { color: #475569; font-weight: 600; font-size: 11px; letter-spacing: 0.4px; }

        /* ===== 筛选面板 ===== */
        .filter-panel {
            position: fixed;
            z-index: 1000;
            background: #fff;
            border: 1px solid #dbe2ee;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(15,23,42,0.18);
            padding: 10px;
            width: 240px;
            max-height: 320px;
            display: flex; flex-direction: column;
            font-size: 12px;
        }
        .filter-panel .fp-head {
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
        }
        .filter-panel .fp-head input {
            flex: 1; padding: 6px 8px; font-size: 12px;
            border: 1px solid #dbe2ee; border-radius: 7px;
        }
        .filter-panel .fp-head input:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        .filter-panel .fp-actions {
            display: flex; gap: 6px; margin-bottom: 6px;
        }
        .filter-panel .fp-actions button {
            flex: 1; padding: 5px 6px; font-size: 11px; font-weight: 600;
            border: 1px solid #dbe2ee; border-radius: 6px; background: #f8fafc;
            cursor: pointer; color: #475569;
        }
        .filter-panel .fp-actions button:hover { background: #eef4ff; border-color: #93b4f5; }
        .filter-panel .fp-list {
            overflow-y: auto; flex: 1; margin: 0 -4px; padding: 0 4px;
        }
        .filter-panel .fp-item {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 6px; border-radius: 6px; cursor: pointer;
        }
        .filter-panel .fp-item:hover { background: #f1f5f9; }
        .filter-panel .fp-item input { cursor: pointer; }
        .filter-panel .fp-item span {
            flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .filter-panel .fp-item .empty-tag {
            font-style: italic; color: #94a3b8; font-size: 11px;
        }
        .filter-panel .fp-footer {
            display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px;
            border-top: 1px solid #eef2f7; padding-top: 8px;
        }
        .filter-panel .fp-footer button {
            padding: 5px 12px; font-size: 11.5px; font-weight: 600;
            border-radius: 6px; cursor: pointer; border: 1px solid #dbe2ee;
            background: #fff; color: #475569;
        }
        .filter-panel .fp-footer button.apply {
            background: #2563eb; border-color: #2563eb; color: #fff;
        }
        .filter-panel .fp-footer button.apply:hover { background: #1d4ed8; }

        @media (max-width: 1280px) {
            table { font-size: 11px; }
            .time-input { max-width: 52px; font-size: 10.5px; }
            .text-input { font-size: 10.5px; }
            .status-select { font-size: 10px; }
        }

        .table-wrap::-webkit-scrollbar { width: 9px; height: 9px; }
        .table-wrap::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-wrap::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== 品牌栏 ===== -->
    <div class="brandbar">
        <div class="logo">P</div>
        <div class="titles">
            <span class="kicker">Payroll System</span>
            <h1>📊 Timecard Report · 演算SHEET <small id="recordCount">0 rows</small></h1>
        </div>
        <div class="spacer"></div>
        <span class="stat-pill">
            <span class="dot"></span>
            Work <b id="summaryWork">0.00h</b> · OT <b id="summaryOT">0.00h</b>
        </span>
    </div>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
        <label class="file-label" for="fileInput">📂 Import Timesheet</label>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">

        <button class="template" id="downloadTemplateBtn">📄 Download Template</button>
        <button class="primary" id="addRowBtn">+ Add Row</button>
        <button class="danger" id="clearBtn">🗑 Clear All</button>

        <div class="spacer"></div>

        <button id="clearFiltersBtn" style="display:none;">✖ Clear Filters</button>
        <button id="exportBtn">📥 Export Excel</button>
    </div>

    <!-- ===== 表格 ===== -->
    <div class="table-wrap" id="tableWrap">
        <table id="timesheetTable">
            <colgroup id="colgroup"></colgroup>
            <thead>
                <tr id="headerRow"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot>
                <tr>
                    <td colspan="15" class="total-label">TOTAL (filtered)</td>
                    <td id="totalBreak">0.00</td>
                    <td id="totalWork">0.00</td>
                    <td id="totalOT">0.00</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    // ============================================================
    //  列定义（与 Excel A–S 19 列完全一致）
    //  key: 数据字段；label: 表头；sub: 副标题；type: 渲染类型
    //  width: 桌面端列宽（px，table-layout:fixed 下生效）
    // ============================================================
    const COLUMNS = [
        { key: '_idx',          label: '#',                    sub: '',        type: 'index',    width: 34,  filter: false },
        { key: 'personId',      label: 'Person ID',            sub: 'A',       type: 'text',     width: 70,  filter: true, cls: 'id' },
        { key: 'firstName',     label: 'First Name',           sub: 'B',       type: 'text',     width: 80,  filter: true },
        { key: 'lastName',      label: 'Last Name',            sub: 'C',       type: 'text',     width: 95,  filter: true },
        { key: 'date',          label: 'Date',                 sub: 'D',       type: 'text',     width: 88,  filter: true },
        { key: 'timesheet',     label: 'Timesheet',            sub: 'E',       type: 'text',     width: 60,  filter: true, cls: 'center' },
        { key: 'clockInAM',     label: 'Clock In',             sub: 'F · AM',  type: 'time',     width: 58,  filter: true },
        { key: 'clockOutAM',    label: 'Clock Out',            sub: 'G · AM',  type: 'time',     width: 58,  filter: true },
        { key: '_am',           label: 'Clock Time(h)',        sub: 'H · AM',  type: 'calc-seg', width: 58,  filter: true },
        { key: 'clockInPM',     label: 'Clock In',             sub: 'I · PM',  type: 'time',     width: 58,  filter: true },
        { key: 'clockOutPM',    label: 'Clock Out',            sub: 'J · PM',  type: 'time',     width: 58,  filter: true },
        { key: '_pm',           label: 'Clock Time(h)',        sub: 'K · PM',  type: 'calc-seg', width: 58,  filter: true },
        { key: 'clockInOT',     label: 'Clock In',             sub: 'L · OT',  type: 'time',     width: 58,  filter: true },
        { key: 'clockOutOT',    label: 'Clock Out',            sub: 'M · OT',  type: 'time',     width: 58,  filter: true },
        { key: '_otSeg',        label: 'Clock Time(h)',        sub: 'N · OT',  type: 'calc-seg', width: 58,  filter: true },
        { key: '_break',        label: 'Total Break Time(h)',  sub: 'O',       type: 'calc-break', width: 72, filter: true },
        { key: '_work',         label: 'Total Work Time(h)',   sub: 'P',       type: 'calc',     width: 72,  filter: true },
        { key: '_ot',           label: 'Total Overtime Time(h)', sub: 'Q',     type: 'calc-ot',  width: 82,  filter: true },
        { key: 'statisticRuleMode', label: 'Statistic Rule Mode', sub: 'R',   type: 'text',     width: 110, filter: true },
        { key: 'status',        label: 'Abnormal Situation',   sub: 'S',       type: 'status',   width: 130, filter: true },
    ];

    const STATUS_OPTIONS = [
        { value: 'AL',  label: 'AL - Annual Leave' },
        { value: 'L',   label: 'L - Leave' },
        { value: 'HAL', label: 'HAL - Half Day Leave' },
        { value: 'SL',  label: 'SL - Sick Leave' },
        { value: 'UL',  label: 'UL - Unpaid Leave' },
        { value: 'OFF', label: 'OFF - Off Day' },
    ];

    // ============================================================
    //  STATE
    // ============================================================
    let rows = [];
    const filters = {}; // { colKey: Set(values) } 值统一转成字符串；'' 代表空格/空值
    let openFilterKey = null;
    let filterPanelEl = null;

    // ============================================================
    //  DOM
    // ============================================================
    const tbody = document.getElementById('tableBody');
    const recordCount = document.getElementById('recordCount');
    const summaryWorkEl = document.getElementById('summaryWork');
    const summaryOTEl = document.getElementById('summaryOT');
    const totalBreakEl = document.getElementById('totalBreak');
    const totalWorkEl = document.getElementById('totalWork');
    const totalOTEl = document.getElementById('totalOT');
    const fileInput = document.getElementById('fileInput');
    const clearFiltersBtn = document.getElementById('clearFiltersBtn');
    const colgroup = document.getElementById('colgroup');
    const headerRow = document.getElementById('headerRow');

    // ============================================================
    //  HELPERS
    // ============================================================
    function generateId() {
        return 'r_' + Math.random().toString(36).slice(2, 9);
    }

    function timeToMinutes(str) {
        if (!str) return null;
        const s = String(str).trim();
        const m = s.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        const h = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        if (h > 23 || min > 59) return null;
        return h * 60 + min;
    }

    function minutesToHoursStr(minutes) {
        if (minutes === null || minutes < 0) return '0.00';
        return (minutes / 60).toFixed(2);
    }

    function calcDuration(inMin, outMin) {
        if (inMin === null || outMin === null) return 0;
        let d = outMin - inMin;
        if (d < 0) d += 24 * 60;
        return d;
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    // ============================================================
    //  CORE CALCULATION（口径保持原样）
    // ============================================================
    function computeRow(row) {
        const inAM = timeToMinutes(row.clockInAM);
        const outAM = timeToMinutes(row.clockOutAM);
        const inPM = timeToMinutes(row.clockInPM);
        const outPM = timeToMinutes(row.clockOutPM);
        const inOT = timeToMinutes(row.clockInOT);
        const outOT = timeToMinutes(row.clockOutOT);

        const status = (row.status || '').toUpperCase();

        const amMin = calcDuration(inAM, outAM);
        const pmMin = calcDuration(inPM, outPM);
        const otMin = calcDuration(inOT, outOT);

        let workMin = 0, breakMin = 0, lateMin = 0, absent = false;

        if (['AL', 'SL', 'UL', 'OFF'].includes(status)) {
            workMin = 0; breakMin = 0; lateMin = 0;
            absent = (status === 'UL');
        } else {
            let span = amMin + pmMin;
            let brk = 0;
            if (inAM !== null && outAM !== null && inPM !== null && outPM !== null) {
                brk = 60;
                span = Math.max(0, span - brk);
            }
            if (status === 'HAL') {
                span = Math.max(amMin, pmMin);
            }
            workMin = span;
            breakMin = brk;

            const STD_START = 8 * 60, STD_END = 17 * 60;
            if (inAM !== null && inAM > STD_START + 30) lateMin += inAM - (STD_START + 30);
            if (inPM !== null && inPM > 13 * 60) lateMin += inPM - 13 * 60;
            if (outPM !== null && outPM < STD_END) lateMin += STD_END - outPM;
        }

        return {
            amMinutes: amMin, pmMinutes: pmMin, otMinutes: otMin,
            breakMinutes: breakMin, workMinutes: workMin,
            lateMinutes: lateMin, absent: absent
        };
    }

    // ============================================================
    //  取某列在"筛选/显示"层面的字符串值
    //  计算列用计算后的显示字符串；空值统一为 ''
    // ============================================================
    function getCellValue(row, calc, colKey) {
        switch (colKey) {
            case 'personId': return String(row.personId || '').trim();
            case 'firstName': return String(row.firstName || '').trim();
            case 'lastName': return String(row.lastName || '').trim();
            case 'date': return String(row.date || '').trim();
            case 'timesheet': return String(row.timesheet || '').trim();
            case 'clockInAM': return String(row.clockInAM || '').trim();
            case 'clockOutAM': return String(row.clockOutAM || '').trim();
            case 'clockInPM': return String(row.clockInPM || '').trim();
            case 'clockOutPM': return String(row.clockOutPM || '').trim();
            case 'clockInOT': return String(row.clockInOT || '').trim();
            case 'clockOutOT': return String(row.clockOutOT || '').trim();
            case '_am': return minutesToHoursStr(calc.amMinutes);
            case '_pm': return minutesToHoursStr(calc.pmMinutes);
            case '_otSeg': return minutesToHoursStr(calc.otMinutes);
            case '_break': return minutesToHoursStr(calc.breakMinutes);
            case '_work': return minutesToHoursStr(calc.workMinutes);
            case '_ot': return minutesToHoursStr(calc.otMinutes);
            case 'statisticRuleMode': return String(row.statisticRuleMode || '').trim();
            case 'status': return String(row.status || '').toUpperCase();
            default: return '';
        }
    }

    function rowPassesFilters(row, calc) {
        for (const colKey in filters) {
            const set = filters[colKey];
            if (!set || set.size === 0) continue;
            const v = getCellValue(row, calc, colKey);
            if (!set.has(v)) return false;
        }
        return true;
    }

    function getFilteredRows() {
        return rows
            .map((row, i) => ({ row, calc: computeRow(row), idx: i }))
            .filter(({ row, calc }) => rowPassesFilters(row, calc));
    }

    // ============================================================
    //  表头（含筛选按钮）
    // ============================================================
    function buildColgroup() {
        colgroup.innerHTML = COLUMNS.map(c =>
            `<col style="width:${c.width}px;">`
        ).join('');
    }

    function buildHeader() {
        headerRow.innerHTML = COLUMNS.map(c => {
            const filterBtn = c.filter
                ? `<button class="filter-btn" data-col="${c.key}" title="Filter">⌄</button>`
                : '';
            return `<th data-col="${c.key}">
                <div class="th-inner">
                    <span>${escapeHtml(c.label)}${filterBtn}</span>
                </div>
                ${c.sub ? `<span class="sub">${escapeHtml(c.sub)}</span>` : ''}
            </th>`;
        }).join('');

        headerRow.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const key = btn.dataset.col;
                toggleFilterPanel(key, btn);
            });
        });
    }
