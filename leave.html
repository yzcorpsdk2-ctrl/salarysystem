<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave · Timecard System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #1a4f8a; --blue-soft: #f4f8fd; --border: #d4e0ee;
    --text: #1f2d3d; --muted: #64748b; --bg: #f7fafd;
    --red: #fecaca; --green: #c6f6d5; --yellow: #fefcbf;
  }
  body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; padding-bottom: 50px; }
  
  /* 顶部导航 */
  .topbar {
    position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--border);
    padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    box-shadow: 0 1px 3px rgba(26,79,138,.06);
  }
  .topbar .brand { font-weight: 700; color: var(--blue); display: flex; align-items: center; gap: 8px; }
  .topbar .brand .logo { width: 30px; height: 30px; background: var(--blue); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
  .url-box { display: flex; align-items: center; gap: 4px; flex: 1; max-width: 420px; background: var(--blue-soft); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
  .url-box input { flex: 1; border: none; background: transparent; padding: 6px 8px; font-size: 12px; outline: none; }
  .url-box button { padding: 5px 12px; border-radius: 4px; border: none; background: var(--blue); color: #fff; font-size: 11px; font-weight: 600; cursor: pointer; }
  .btn { background: #fff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 5px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--blue); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: all 0.2s; }
  .btn:hover { background: var(--blue-soft); }
  .btn-success { background: #0f7a54; color: #fff; border-color: #0f7a54; }
  .btn-success:hover { background: #0c6a48; }
  .sync-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--blue-soft); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--muted); }
  .sync-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #9db8d2; }
  .sync-badge.ok .dot { background: #22c55e; }
  .sync-badge.busy .dot { background: #f59e0b; }
  .sync-badge.err .dot { background: #ef4444; }

  /* 顶部控制面板 (仪表盘) */
  .container { max-width: 100%; padding: 14px 18px; }
  .dashboard-panel {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(15,23,42,.03);
  }
  .dp-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
  }
  .dp-item {
    background: var(--blue-soft); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .dp-item label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 自适应文字大小，自动换行 */
  .dp-item span, .dp-item input { font-size: clamp(12px, 1.2vw, 15px); font-weight: 800; color: var(--blue); outline: none; border: none; background: transparent; width: 100%; word-break: break-word; line-height: 1.2; }
  .dp-item input:hover, .dp-item input:focus { border-bottom: 1px solid var(--blue); }
  
  /* 搜索下拉 */
  .search-wrap { position: relative; grid-column: span 2; }
  .search-wrap input { font-size: 13px; font-weight: 600; color: var(--text); padding: 4px 0; width: 100%; border: none; border-bottom: 2px dashed #b8cfe8; background: transparent; outline: none; }
  .search-wrap input:focus { border-bottom-color: var(--blue); }
  .search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,.1); max-height: 200px; overflow-y: auto; z-index: 50; display: none;
  }
  .search-dropdown.show { display: block; }
  .sd-item { padding: 8px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid #f1f5f9; }
  .sd-item:hover { background: var(--blue-soft); color: var(--blue); }
  .sd-item.all-item { font-weight: 700; color: #0f7a54; background: #f0fdf4; border-bottom: 2px solid #bbf7d0; }

  /* 表格 */
  .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; max-height: calc(100vh - 320px); position: relative; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 11.5px; }
  thead th {
    position: sticky; top: 0; z-index: 3; background: #eef4fb; color: #334155;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
    padding: 8px 5px; border-right: 1px solid #dbe6f2; border-bottom: 2px solid #cbd9ea;
    white-space: nowrap; text-align: center;
  }
  thead th .th-inner { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .filter-btn { border: none; background: transparent; cursor: pointer; font-size: 9px; color: #94a3b8; padding: 2px 4px; border-radius: 4px; }
  .filter-btn:hover { background: #dbeafe; color: #2563eb; }
  .filter-btn.active { color: #2563eb; background: #bfdbfe; }
  tbody td { padding: 3px 4px; border-bottom: 1px solid #eef3f9; border-right: 1px solid #f2f6fb; text-align: center; white-space: nowrap; height: 34px; }
  tbody tr:hover { background: #f7fbff; }
  
  .ro { color: #334155; font-weight: 600; }
  .calc { background: #f6f9ff; font-weight: 700; color: #0f172a; }
  
  input.cell, select.cell { width: 100%; min-width: 54px; padding: 4px 4px; font-size: 11.5px; text-align: center; border: 1px solid transparent; border-radius: 5px; background: transparent; color: #0f172a; transition: all 0.15s; }
  input.cell:hover, select.cell:hover { border-color: #cbd5e1; background: #fff; }
  input.cell:focus, select.cell:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 2px rgba(26,79,138,.12); }
  input.cell:disabled, select.cell:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
  input.cell.wide { min-width: 120px; text-align: left; }

  /* 行高亮 */
  tr.hl-red td:nth-child(-n+20) { background: var(--red) !important; }
  tr.hl-green td:nth-child(-n+20) { background: var(--green) !important; }
  tr.hl-yellow td:nth-child(-n+20) { background: var(--yellow) !important; }
  .sit-active { color: #15803d; font-weight: 700; }
  .sit-pending { color: #b45309; font-weight: 700; }
  .sit-inactive { color: #b91c1c; font-weight: 700; }
  tr.row-inactive td { background: #fecaca !important; }

  /* STATUS 选项联动颜色 */
  select.status-ANNUAL_LEAVE { background-color: #fca5a5; color: #7f1d1d; font-weight: 600; border-color: #f87171; }
  select.status-UNPAID_LEAVE { background-color: #bbf7d0; color: #14532d; font-weight: 600; border-color: #4ade80; }
  select.status-SICK_LEAVE { background-color: #fef08a; color: #713f12; font-weight: 600; border-color: #facc15; }
  select.status-HALF_DAY_LEAVE { background-color: #bae6fd; color: #0c4a6e; font-weight: 600; border-color: #38bdf8; }
  select.status-OFF_DAY { background-color: #1e3a8a; color: #ffffff; font-weight: 600; border-color: #1e3a8a; }
  select.status-MATERNITY_LEAVE { background-color: #fbcfe8; color: #831843; font-weight: 600; border-color: #f472b6; }
  select.status-UNDEDUCTION_LEAVE { background-color: #c7d2fe; color: #312e81; font-weight: 600; border-color: #818cf8; }
  td.bg-ANNUAL_LEAVE { background-color: #fca5a5 !important; }
  td.bg-UNPAID_LEAVE { background-color: #bbf7d0 !important; }
  td.bg-SICK_LEAVE { background-color: #fef08a !important; }
  td.bg-HALF_DAY_LEAVE { background-color: #bae6fd !important; }
  td.bg-OFF_DAY { background-color: #1e3a8a !important; color: #fff !important; }
  td.bg-MATERNITY_LEAVE { background-color: #fbcfe8 !important; }
  td.bg-UNDEDUCTION_LEAVE { background-color: #c7d2fe !important; }

  /* 其它组件 */
  .filter-panel { position: fixed; z-index: 1000; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 30px rgba(15,23,42,.15); padding: 10px; width: 220px; max-height: 300px; display: none; flex-direction: column; font-size: 12px; }
  .filter-panel.show { display: flex; }
  .fp-head { margin-bottom: 8px; }
  .fp-head input { width: 100%; padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; }
  .fp-actions { display: flex; gap: 5px; margin-bottom: 6px; }
  .fp-actions button { flex: 1; padding: 4px; font-size: 10.5px; border: 1px solid var(--border); background: #f8fafc; border-radius: 4px; cursor: pointer; }
  .fp-list { overflow-y: auto; flex: 1; }
  .fp-item { display: flex; align-items: center; gap: 6px; padding: 4px 5px; border-radius: 4px; cursor: pointer; }
  .fp-item:hover { background: #f1f5f9; }
  .fp-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fp-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; border-top: 1px solid #eef2f7; padding-top: 8px; }
  .fp-footer button { padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  .fp-footer button.apply { background: var(--blue); color: #fff; border-color: var(--blue); }
  
  .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 9999; display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 22px 24px; width: 360px; max-width: 92vw; box-shadow: 0 20px 60px rgba(15,23,42,.35); text-align: center; }
  .modal h3 { font-size: 15px; color: var(--blue); margin-bottom: 8px; }
  .modal p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  .modal .countdown { font-size: 26px; font-weight: 800; color: #dc2626; margin: 6px 0 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: center; }
  .modal .actions button { padding: 8px 18px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); }
  .modal .actions button.confirm { background: var(--blue); color: #fff; border-color: var(--blue); }
  .empty { text-align: center; padding: 50px 20px; color: #94a3b8; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="logo">P</div> Leave · Timecard</div>
  <div class="url-box">
    <input type="text" id="deployUrlInput" placeholder="Apps Script URL (auto sync dari dashboard)...">
    <button onclick="applyUrl()">🔗 Apply</button>
  </div>
  <button class="btn" onclick="loadData()"><i>🔄</i> Muat Semula</button>
  <button class="btn btn-success" onclick="manualSave()">💾 Simpan</button>
  <span class="sync-badge" id="syncBadge"><span class="dot"></span><span id="syncText">Sedia</span></span>
</div>

<div class="container">
  <!-- 顶部员工与假期汇总面板 -->
  <div class="dashboard-panel" id="dashboardPanel">
    <div class="dp-grid">
      
      <!-- 员工搜索 -->
      <div class="dp-item search-wrap">
        <label>Cari Pekerja (ID / Nama)</label>
        <input type="text" id="searchEmployeeInput" placeholder="Taip nama atau ID..." autocomplete="off">
        <div class="search-dropdown" id="searchEmployeeDropdown"></div>
      </div>

      <!-- Kumpulan 搜索 -->
      <div class="dp-item search-wrap">
        <label>Cari Kumpulan (Group)</label>
        <input type="text" id="searchGroupInput" placeholder="Taip kumpulan..." autocomplete="off">
        <div class="search-dropdown" id="searchGroupDropdown"></div>
      </div>

      <div class="dp-item"><label>Situation</label><span id="dpSituation">-</span></div>
      <div class="dp-item"><label>Gaji (RM)</label><span id="dpGaji">0.00</span></div>
      
      <div class="dp-item" style="background:#fff3e0;"><label>Last AL Remain (Days)</label><span id="dpLastAL">0</span></div>
      <div class="dp-item" style="background:#e8f5e9;"><label>Last SL Remain (Days)</label><span id="dpLastSL">0</span></div>
      <div class="dp-item"><label>AL Picked This Month</label><span id="dpPickedAL">0</span></div>
      <div class="dp-item"><label>SL Picked This Month</label><span id="dpPickedSL">0</span></div>
      <div class="dp-item"><label>UNPL Picked This Month</label><span id="dpPickedUNPL">0</span></div>
      <div class="dp-item"><label>Off Days This Month</label><span id="dpPickedOFF">0</span></div>
      <div class="dp-item"><label>Half L Picked This Month</label><span id="dpPickedHALF">0</span></div>
      <div class="dp-item"><label>Unddctn L Picked This Month</label><span id="dpPickedUNDD">0</span></div>
      <div class="dp-item"><label>Mtnt L Picked This Month</label><span id="dpPickedMTNT">0</span></div>
      
      <div class="dp-item" style="background:#d1fae5; border-color:#6ee7b7;"><label>This AL Remain (Days)</label><span id="dpThisAL">0</span></div>
      <div class="dp-item" style="background:#d1fae5; border-color:#6ee7b7;"><label>This SL Remain (Days)</label><span id="dpThisSL">0</span></div>
      <div class="dp-item"><label>Unpaid Leave (Days)</label><span id="dpPickedUNPL2">0</span></div>
      <div class="dp-item" style="background:#fecaca; border-color:#f87171;"><label>Total Deduction (RM)</label><span id="dpTotalDeduct">0.00</span></div>
    </div>
  </div>

  <!-- 表格部分 -->
  <div class="table-wrap">
    <table id="mainTable">
      <thead><tr id="headerRow"></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- 筛选面板 & 自动保存弹窗 (保持原样) -->
<div class="filter-panel" id="filterPanel">
  <div class="fp-head"><input type="text" id="fpSearch" placeholder="Cari nilai..."></div>
  <div class="fp-actions">
    <button onclick="fpSelectAll()">Select All</button>
    <button onclick="fpClearAll()">Clear</button>
  </div>
  <div class="fp-list" id="fpList"></div>
  <div class="fp-footer">
    <button onclick="fpClose()">Cancel</button>
    <button class="apply" onclick="fpApply()">Apply</button>
  </div>
</div>

<div class="modal-mask" id="autoSaveModal">
  <div class="modal">
    <h3>⏰ Autosave</h3>
    <p>Perubahan akan disimpan secara automatik.</p>
    <div class="countdown" id="countdownNum">10</div>
    <div class="actions">
      <button onclick="autoSaveCancel()">Cancel</button>
      <button class="confirm" onclick="autoSaveConfirm()">Confirm</button>
    </div>
  </div>
</div>

<script>
const URL_KEY = 'payrollScriptUrl';
const SHEET_HEADERS = [
  'ID KOD','SITUATION','GROUP','NAME','SHIF','GAJI','Date',
  'Clock In 01','Clock Out 01','Clock Time(h) 01',
  'Clock In 02','Clock Out 02','Clock Time(h) 02',
  'Clock In 03','Clock Out 03','Clock Time(h) 03',
  'Total Break Time(h)','Total Work Time(h)','Total Over Time (h)',
  'SITUATION WORK TIME','STATUS','HALF TT JAM','HALF TT MIN',
  'TOTAL DEDUCTION(RM)','THIS AL REMAIN','THIS SL REMAIN','REMARK'
];

const READONLY_COLS = ['ID KOD','SITUATION','GROUP','NAME','SHIF','GAJI',
  'Clock Time(h) 01','Clock Time(h) 02','Clock Time(h) 03',
  'Total Break Time(h)','Total Work Time(h)','Total Over Time (h)',
  'SITUATION WORK TIME','TOTAL DEDUCTION(RM)','THIS AL REMAIN','THIS SL REMAIN'];

const STATUS_OPTIONS = ['', 'ANNUAL LEAVE','UNPAID LEAVE','HALF DAY LEAVE','SICK LEAVE','OFF DAY','UNDEDUCTION LEAVE','MATERNITY LEAVE'];

let SCRIPT_URL = '';
let allRows = [];
let filteredRows = [];
let staffList = [];
let alslData = [];

// 当前选中的 ID 和 GROUP
let currentSelectedCode = 'ALL'; 
let currentSelectedGroup = 'ALL';

let filters = {};
let currentFilterCol = null;
let tempCheckedValues = new Set();

let dirty = false;
let idleTimer = null;
let countdownTimer = null;
let countdownLeft = 10;
let modalOpen = false;

function loadSavedUrl() {
  SCRIPT_URL = localStorage.getItem(URL_KEY) || '';
  document.getElementById('deployUrlInput').value = SCRIPT_URL;
}
function applyUrl() {
  const url = document.getElementById('deployUrlInput').value.trim();
  if (!url) { alert('Masukkan URL terlebih dahulu.'); return; }
  localStorage.setItem(URL_KEY, url);
  SCRIPT_URL = url;
  loadData();
}
window.addEventListener('storage', e => {
  if (e.key === URL_KEY && e.newValue) {
    SCRIPT_URL = e.newValue;
    document.getElementById('deployUrlInput').value = e.newValue;
    loadData();
  }
});

function setSync(state, text) {
  const b = document.getElementById('syncBadge');
  b.className = 'sync-badge ' + (state || '');
  document.getElementById('syncText').textContent = text;
}

async function loadData() {
  if (!SCRIPT_URL) { setSync('err', 'URL belum ditetapkan'); return; }
  setSync('busy', 'Memuatkan...');
  try {
    const [resSheet, resStaff, resALSL] = await Promise.all([
      fetch(`${SCRIPT_URL}?action=getSheetData&_t=${Date.now()}`).then(r=>r.json()),
      fetch(`${SCRIPT_URL}?action=getData&_t=${Date.now()}`).then(r=>r.json()),
      fetch(`${SCRIPT_URL}?action=getALSLData&_t=${Date.now()}`).then(r=>r.json())
    ]);

    if (resSheet.status !== 'success') throw new Error('Gagal load SHEET');
    
    allRows = (resSheet.data || []).map(r => {
      const o = {};
      SHEET_HEADERS.forEach(h => {
        let v = r[h];
        if (v === undefined || v === null) v = '';
        if (h === 'Date') v = normalizeDate(v);
        o[h] = v;
      });
      return o;
    });
    
    if (resStaff.result === 'success') staffList = resStaff.data || [];
    if (resALSL.status === 'success') alslData = resALSL.data || [];

    // 恢复上次选择或默认 ALL
    const savedCode = localStorage.getItem('leaveSelectedCode') || 'ALL';
    const savedGroup = localStorage.getItem('leaveSelectedGroup') || 'ALL';
    
    selectGroup(savedGroup, false); // 先选组
    selectEmployee(savedCode, false); // 再选人 (如果是ALL会覆盖组)
    
    updateDashboardStats();
    applyFiltersAndRender();

    setSync('ok', 'Data dimuat');
  } catch (err) {
    console.error(err);
    setSync('err', 'Gagal muat: ' + err.message);
  }
}

function pad2(n){ return String(n).padStart(2,'0'); }
function normalizeDate(v) {
  if (!v) return '';
  if (v instanceof Date) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  let s = String(v).trim();
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return s;
}
function timeToMin(s) {
  if (!s) return null;
  const str = String(s).trim();
  const match12 = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)$/i);
  if (match12) {
    let h = parseInt(match12[1], 10);
    const m = parseInt(match12[2], 10);
    const ampm = match12[4].toUpperCase();
    if (ampm === 'PM' && h < 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return h * 60 + m;
  }
  const match24 = str.match(/^(\d{1,2}):(\d{2})$/);
  if (match24) {
    const h = parseInt(match24[1], 10), m = parseInt(match24[2], 10);
    if (h <= 23 && m <= 59) return h * 60 + m;
  }
  return null;
}
function formatDuration(totalMinutes) {
  if (!totalMinutes || totalMinutes <= 0) return '00:00:00';
  const totalSeconds = Math.round(totalMinutes * 60);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function computeRow(r) {
  const segs = [
    [timeToMin(r['Clock In 01']), timeToMin(r['Clock Out 01'])],
    [timeToMin(r['Clock In 02']), timeToMin(r['Clock Out 02'])],
    [timeToMin(r['Clock In 03']), timeToMin(r['Clock Out 03'])]
  ];
  const segH = segs.map(([a,b]) => (a!==null && b!==null && b>=a) ? b-a : 0);
  const hasAnyIn = segs.some(([a])=>a!==null);
  const missingOut = segs.some(([a,b]) => a!==null && b===null);

  const totalSegMin = segH[0]+segH[1]+segH[2];
  const workMin = hasAnyIn ? Math.max(0, totalSegMin - 60) : 0;
  const otMin = Math.max(0, workMin - 7*60-30);

  let swt = '', hl = '';
  if (!hasAnyIn) { swt = '未存在打卡记录'; }
  else if (missingOut) { swt = '缺少打卡记录'; hl = 'hl-red'; }
  else if (workMin > 7*60+30) { swt = '超时工作'; hl = 'hl-green'; }
  else { swt = '工时不足'; hl = 'hl-yellow'; }

  const gaji = parseFloat(r['GAJI']) || 0;
  const status = (r['STATUS'] || '').toUpperCase();
  let deduct = 0;
  if (status === 'UNPAID LEAVE') {
    deduct = gaji / 30;
  } else if (status === 'HALF DAY LEAVE') {
    const j = parseFloat(r['HALF TT JAM']) || 0;
    const m = parseFloat(r['HALF TT MIN']) || 0;
    const hrs = j + m/60;
    const hourly = (gaji/30)/7.5;
    deduct = hourly * hrs;
  }
  return { segH, workMin, otMin, swt, hl, deduct };
}

// ================= 搜索与选中逻辑 =================
const searchInput = document.getElementById('searchEmployeeInput');
const searchDropdown = document.getElementById('searchEmployeeDropdown');
const groupInput = document.getElementById('searchGroupInput');
const groupDropdown = document.getElementById('searchGroupDropdown');

searchInput.addEventListener('focus', () => { searchInput.select(); });
groupInput.addEventListener('focus', () => { groupInput.select(); });

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let matches = staffList.filter(s => 
    String(s.Name || '').toLowerCase().includes(q) || 
    String(s.Code || '').toLowerCase().includes(q)
  ).slice(0, 20);
  
  let html = `<div class="sd-item all-item" onclick="selectEmployee('ALL')">🌐 ALL (Semua Pekerja)</div>`;
  if (matches.length > 0) {
    html += matches.map(m => `<div class="sd-item" onclick="selectEmployee('${m.Code}')"><b>${m.Code}</b> - ${m.Name}</div>`).join('');
  }
  searchDropdown.innerHTML = html;
  searchDropdown.classList.add('show');
});

groupInput.addEventListener('input', () => {
  const q = groupInput.value.trim().toLowerCase();
  const groups = new Set();
  staffList.forEach(s => { if (s.GroupName) groups.add(String(s.GroupName).trim()); });
  const matches = Array.from(groups).filter(g => g.toLowerCase().includes(q));

  let html = `<div class="sd-item all-item" onclick="selectGroup('ALL')">🌐 ALL (Semua Kumpulan)</div>`;
  if (matches.length > 0) {
    html += matches.map(g => `<div class="sd-item" onclick="selectGroup('${g}')">${g}</div>`).join('');
  }
  groupDropdown.innerHTML = html;
  groupDropdown.classList.add('show');
});

document.addEventListener('click', (e) => {
  if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) searchDropdown.classList.remove('show');
  if (!groupInput.contains(e.target) && !groupDropdown.contains(e.target)) groupDropdown.classList.remove('show');
});

function selectEmployee(code, renderNow = true) {
  currentSelectedCode = code;
  localStorage.setItem('leaveSelectedCode', code);
  
  if (code === 'ALL') {
    searchInput.value = 'ALL (Semua Pekerja)';
    // 选 ALL 时，重置 Group
    currentSelectedGroup = 'ALL';
    localStorage.setItem('leaveSelectedGroup', 'ALL');
    groupInput.value = 'ALL (Semua Kumpulan)';
  } else {
    const staff = staffList.find(s => String(s.Code) === String(code));
    if (staff) searchInput.value = `${staff.Code} - ${staff.Name}`;
  }
  searchDropdown.classList.remove('show');
  
  if (renderNow) { updateDashboardStats(); applyFiltersAndRender(); }
}

function selectGroup(group, renderNow = true) {
  currentSelectedGroup = group;
  localStorage.setItem('leaveSelectedGroup', group);
  
  if (group === 'ALL') {
    groupInput.value = 'ALL (Semua Kumpulan)';
  } else {
    groupInput.value = group;
    // 选 Group 时，重置员工为 ALL
    currentSelectedCode = 'ALL';
    localStorage.setItem('leaveSelectedCode', 'ALL');
    searchInput.value = 'ALL (Semua Pekerja)';
  }
  groupDropdown.classList.remove('show');
  
  if (renderNow) { updateDashboardStats(); applyFiltersAndRender(); }
}

// ================= 面板统计计算 =================
function updateDashboardStats() {
  let targetStaffCodes = [];
  let labelGaji = 0, labelLastAL = 0, labelLastSL = 0;
  
  // 1. 确定要统计的员工范围
  if (currentSelectedCode !== 'ALL') {
    targetStaffCodes = [currentSelectedCode];
    const staff = staffList.find(s => String(s.Code) === String(currentSelectedCode));
    if (staff) {
      document.getElementById('dpSituation').textContent = staff.Situation || '-';
      labelGaji = parseFloat(staff.Salary || 0);
    }
  } else if (currentSelectedGroup !== 'ALL') {
    const groupStaff = staffList.filter(s => String(s.GroupName).trim() === currentSelectedGroup);
    targetStaffCodes = groupStaff.map(s => String(s.Code));
    document.getElementById('dpSituation').textContent = 'GROUP';
    labelGaji = groupStaff.reduce((sum, s) => sum + (parseFloat(s.Salary) || 0), 0);
  } else {
    targetStaffCodes = staffList.map(s => String(s.Code));
    document.getElementById('dpSituation').textContent = 'ALL';
    labelGaji = staffList.reduce((sum, s) => sum + (parseFloat(s.Salary) || 0), 0);
  }

  document.getElementById('dpGaji').textContent = labelGaji.toFixed(2);

  // 2. 统计 Last AL/SL (从 ALSLREMAIN 拿)
  targetStaffCodes.forEach(code => {
    const alsl = alslData.find(a => String(a['ID KOD']) === code);
    if (alsl) {
      labelLastAL += parseFloat(alsl['LASTAL']) || 0;
      labelLastSL += parseFloat(alsl['LASTSL']) || 0;
    }
  });
  document.getElementById('dpLastAL').textContent = labelLastAL.toFixed(1);
  document.getElementById('dpLastSL').textContent = labelLastSL.toFixed(1);

  // 3. 统计打卡记录 (限定本月)
  let targetMonth = '';
  if (allRows.length > 0) {
    const dates = allRows.map(r => r['Date']).filter(d => d).sort();
    if (dates.length > 0) targetMonth = dates[dates.length - 1].substring(0, 7);
  }

  let countAL = 0, countSL = 0, countUNPL = 0, countOFF = 0, countHALF = 0, countUNDD = 0, countMTNT = 0;
  let totalDeduct = 0;

  allRows.forEach(r => {
    if (!targetStaffCodes.includes(String(r['ID KOD']))) return;

    if (targetMonth && r['Date'] && r['Date'].startsWith(targetMonth)) {
      const s = (r['STATUS'] || '').toUpperCase();
      if (s === 'ANNUAL LEAVE') countAL++;
      if (s === 'SICK LEAVE') countSL++;
      if (s === 'UNPAID LEAVE') countUNPL++;
      if (s === 'OFF DAY') countOFF++;
      if (s === 'HALF DAY LEAVE') countHALF++;
      if (s === 'UNDEDUCTION LEAVE') countUNDD++;
      if (s === 'MATERNITY LEAVE') countMTNT++;
    }
    const c = computeRow(r);
    totalDeduct += c.deduct;
  });

  const thisAL = labelLastAL - countAL;
  const thisSL = labelLastSL - countSL;

  document.getElementById('dpPickedAL').textContent = countAL;
  document.getElementById('dpPickedSL').textContent = countSL;
  document.getElementById('dpPickedUNPL').textContent = countUNPL;
  document.getElementById('dpPickedOFF').textContent = countOFF;
  document.getElementById('dpPickedHALF').textContent = countHALF;
  document.getElementById('dpPickedUNDD').textContent = countUNDD;
  document.getElementById('dpPickedMTNT').textContent = countMTNT;
  
  document.getElementById('dpThisAL').textContent = thisAL.toFixed(1);
  document.getElementById('dpThisSL').textContent = thisSL.toFixed(1);
  document.getElementById('dpPickedUNPL2').textContent = countUNPL;
  document.getElementById('dpTotalDeduct').textContent = totalDeduct.toFixed(2);
}

// ================= 渲染表格 =================
function applyFiltersAndRender() {
  let baseRows = allRows;
  
  if (currentSelectedCode !== 'ALL') {
    baseRows = baseRows.filter(r => String(r['ID KOD']) === String(currentSelectedCode));
  } else if (currentSelectedGroup !== 'ALL') {
    const groupStaff = staffList.filter(s => String(s.GroupName).trim() === currentSelectedGroup);
    const codes = groupStaff.map(s => String(s.Code));
    baseRows = baseRows.filter(r => codes.includes(String(r['ID KOD'])));
  }

  filteredRows = baseRows.filter(r => {
    for (const col in filters) {
      const set = filters[col];
      if (set && set.size > 0) {
        let val = r[col] ? String(r[col]).trim() : '';
        if (!set.has(val)) return false;
      }
    }
    return true;
  });
  render();
}

function render() {
  const hdr = document.getElementById('headerRow');
  let hHtml = '<th>#</th>';
  SHEET_HEADERS.forEach(h => {
    const isActive = filters[h] && filters[h].size > 0 ? 'active' : '';
    hHtml += `<th><div class="th-inner"><span>${h}</span><button class="filter-btn ${isActive}" onclick="openFilter('${h}', event)">▼</button></div></th>`;
  });
  hdr.innerHTML = hHtml;

  const tb = document.getElementById('tableBody');
  if (!filteredRows.length) {
    tb.innerHTML = `<tr><td colspan="${SHEET_HEADERS.length+1}"><div class="empty">Tiada data atau tiada baris sepadan.</div></td></tr>`;
    return;
  }
  const frag = document.createDocumentFragment();
  filteredRows.forEach((r, i) => frag.appendChild(buildRow(r, i)));
  tb.innerHTML = ''; tb.appendChild(frag);
}

function buildRow(r, i) {
  const c = computeRow(r);
  const tr = document.createElement('tr');
  if (c.hl) tr.classList.add(c.hl);
  
  const situation = (r['SITUATION'] || '').toUpperCase();
  if (situation === 'INACTIVE') tr.classList.add('row-inactive');

  const tdIdx = document.createElement('td'); tdIdx.className = 'col-idx'; tdIdx.textContent = i+1; tr.appendChild(tdIdx);

  SHEET_HEADERS.forEach(h => {
    const td = document.createElement('td');
    
    if (h === 'SITUATION WORK TIME') {
      td.className = 'calc ' + (c.hl ? c.hl.replace('hl-', 'bg-') : ''); 
      td.textContent = c.swt;
    } 
    else if (h === 'Clock Time(h) 01' || h === 'Clock Time(h) 02' || h === 'Clock Time(h) 03') {
      const k = h.endsWith('01') ? 0 : h.endsWith('02') ? 1 : 2;
      td.className = 'calc'; td.textContent = formatDuration(c.segH[k]);
    } 
    else if (h === 'Total Break Time(h)') {
      td.className = 'calc'; td.textContent = c.workMin > 0 ? '01:00:00' : '00:00:00';
    } 
    else if (h === 'Total Work Time(h)') {
      td.className = 'calc'; td.textContent = formatDuration(c.workMin);
    } 
    else if (h === 'Total Over Time (h)') {
      td.className = 'calc'; td.textContent = formatDuration(c.otMin);
    } 
    else if (h === 'TOTAL DEDUCTION(RM)') {
      td.className = 'calc'; td.textContent = c.deduct ? c.deduct.toFixed(2) : '0.00';
    } 
    else if (h === 'THIS AL REMAIN' || h === 'THIS SL REMAIN') {
      td.className = 'calc';
      // 如果是查看个别人，用该人的；如果是 ALL/GROUP，暂时用全局头部统计数字
      td.textContent = h === 'THIS AL REMAIN' ? document.getElementById('dpThisAL').textContent : document.getElementById('dpThisSL').textContent;
    }
    else if (h === 'SITUATION') {
      let cls = 'ro';
      if (situation === 'ACTIVE') cls += ' sit-active';
      else if (situation === 'PENDING') cls += ' sit-pending';
      else if (situation === 'INACTIVE') cls += ' sit-inactive';
      td.className = cls; td.textContent = r[h] || '';
    }
    else if (h === 'STATUS') {
      const sel = document.createElement('select'); sel.className = 'cell';
      STATUS_OPTIONS.forEach(o => {
        const opt = document.createElement('option'); opt.value = o; opt.textContent = o || '— Pilih —';
        if ((r[h]||'').toUpperCase() === o) opt.selected = true;
        sel.appendChild(opt);
      });
      
      const applyStatusColor = () => {
        const val = (sel.value || '').toUpperCase().replace(/\s+/g, '_');
        sel.className = 'cell ' + (val ? 'status-' + val : '');
        const codeTd = tr.children[1];
        const nameTd = tr.children[4];
        codeTd.className = 'ro ' + (val ? 'bg-' + val : '');
        nameTd.className = 'ro ' + (val ? 'bg-' + val : '');
      };
      applyStatusColor();

      sel.addEventListener('change', () => { 
        r[h] = sel.value; markDirty(); 
        applyStatusColor();
        updateDashboardStats();
        if (filters[h]) applyFiltersAndRender();
        else {
           const idx = filteredRows.indexOf(r);
           if (idx !== -1) { const newTr = buildRow(r, idx); tr.replaceWith(newTr); }
        }
      });
      td.appendChild(sel);
    } 
    else if (READONLY_COLS.includes(h)) {
      td.className = 'ro'; td.textContent = r[h] || '';
    } 
    else {
      const inp = document.createElement('input');
      inp.className = 'cell' + (h === 'REMARK' ? ' wide' : '');
      inp.value = r[h] || '';
      inp.placeholder = h === 'Date' ? 'YYYY-MM-DD' : (h.startsWith('Clock') ? '6:34:55 AM' : '');
      if ((h === 'HALF TT JAM' || h === 'HALF TT MIN') && (r['STATUS']||'').toUpperCase() !== 'HALF DAY LEAVE') inp.disabled = true;
      
      inp.addEventListener('input', () => {
        r[h] = h === 'Date' ? normalizeDate(inp.value) : inp.value.trim();
        markDirty();
      });
      inp.addEventListener('change', () => {
        if (h === 'Date') inp.value = normalizeDate(inp.value);
        updateDashboardStats();
        const idx = filteredRows.indexOf(r);
        if (idx !== -1) { const newTr = buildRow(r, idx); tr.replaceWith(newTr); }
      });
      td.appendChild(inp);
    }
    tr.appendChild(td);
  });
  return tr;
}

// ================= 列筛选面板 (保持原样) =================
function openFilter(col, e) {
  e.stopPropagation();
  currentFilterCol = col;
  const panel = document.getElementById('filterPanel');
  const rect = e.target.getBoundingClientRect();
  
  const valSet = new Set();
  let baseRows = allRows;
  if (currentSelectedCode !== 'ALL') {
    baseRows = baseRows.filter(r => String(r['ID KOD']) === String(currentSelectedCode));
  } else if (currentSelectedGroup !== 'ALL') {
    const groupStaff = staffList.filter(s => String(s.GroupName).trim() === currentSelectedGroup);
    const codes = groupStaff.map(s => String(s.Code));
    baseRows = baseRows.filter(r => codes.includes(String(r['ID KOD'])));
  }

  baseRows.forEach(r => valSet.add(r[col] ? String(r[col]).trim() : ''));
  const vals = Array.from(valSet).sort((a,b) => {
    if (a === '') return -1;
    if (b === '') return 1;
    return a.localeCompare(b, undefined, {numeric: true});
  });

  tempCheckedValues = filters[col] ? new Set(filters[col]) : new Set(vals);
  const listEl = document.getElementById('fpList');
  const searchEl = document.getElementById('fpSearch');
  searchEl.value = '';
  
  const renderList = (kw) => {
    kw = (kw||'').toLowerCase();
    const shown = vals.filter(v => {
      if (!kw) return true;
      if (v === '') return '(empty)'.includes(kw) || 'kosong'.includes(kw);
      return v.toLowerCase().includes(kw);
    });
    listEl.innerHTML = shown.map(v => {
      const checked = tempCheckedValues.has(v) ? 'checked' : '';
      const lbl = v === '' ? '<span style="color:#94a3b8;font-style:italic;">(Empty)</span>' : v;
      return `<label class="fp-item"><input type="checkbox" value="${v}" ${checked} onchange="fpToggle(this)"><span>${lbl}</span></label>`;
    }).join('');
  };
  renderList('');

  searchEl.oninput = () => renderList(searchEl.value);

  panel.style.left = Math.min(rect.left, window.innerWidth - 240) + 'px';
  panel.style.top = (rect.bottom + 5) + 'px';
  panel.classList.add('show');
  
  document.addEventListener('mousedown', closeFilterOnClickOutside);
}

function fpToggle(cb) {
  if (cb.checked) tempCheckedValues.add(cb.value);
  else tempCheckedValues.delete(cb.value);
}
function fpSelectAll() {
  const cbs = document.querySelectorAll('#fpList input[type="checkbox"]');
  cbs.forEach(cb => { cb.checked = true; tempCheckedValues.add(cb.value); });
}
function fpClearAll() {
  const cbs = document.querySelectorAll('#fpList input[type="checkbox"]');
  cbs.forEach(cb => { cb.checked = false; });
  tempCheckedValues.clear();
}
function fpApply() {
  let baseRows = allRows;
  if (currentSelectedCode !== 'ALL') {
    baseRows = baseRows.filter(r => String(r['ID KOD']) === String(currentSelectedCode));
  } else if (currentSelectedGroup !== 'ALL') {
    const groupStaff = staffList.filter(s => String(s.GroupName).trim() === currentSelectedGroup);
    const codes = groupStaff.map(s => String(s.Code));
    baseRows = baseRows.filter(r => codes.includes(String(r['ID KOD'])));
  }

  const allVals = new Set();
  baseRows.forEach(r => allVals.add(r[currentFilterCol] ? String(r[currentFilterCol]).trim() : ''));
  
  if (tempCheckedValues.size === allVals.size) {
    delete filters[currentFilterCol];
  } else {
    filters[currentFilterCol] = new Set(tempCheckedValues);
  }
  fpClose();
  applyFiltersAndRender();
}
function fpClose() {
  document.getElementById('filterPanel').classList.remove('show');
  document.removeEventListener('mousedown', closeFilterOnClickOutside);
}
function closeFilterOnClickOutside(e) {
  const p = document.getElementById('filterPanel');
  if (!p.contains(e.target) && !e.target.classList.contains('filter-btn')) fpClose();
}

// ================= 自动保存 =================
function markDirty() {
  dirty = true;
  setSync('busy', 'Perubahan belum disimpan');
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (dirty && !modalOpen) startAutoSaveCountdown(); }, 15000);
}

function startAutoSaveCountdown() {
  modalOpen = true;
  countdownLeft = 10;
  document.getElementById('countdownNum').textContent = countdownLeft;
  document.getElementById('autoSaveModal').classList.add('show');
  countdownTimer = setInterval(() => {
    countdownLeft--;
    document.getElementById('countdownNum').textContent = countdownLeft;
    if (countdownLeft <= 0) { clearInterval(countdownTimer); countdownTimer=null; closeModal(); doSave(); }
  }, 1000);
}

function closeModal() {
  modalOpen = false;
  document.getElementById('autoSaveModal').classList.remove('show');
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}
function autoSaveCancel() { closeModal(); }
function autoSaveConfirm() { closeModal(); doSave(); }

async function manualSave() {
  if (!SCRIPT_URL) { alert('URL belum ditetapkan.'); return; }
  if (!allRows.length) { alert('Tiada data untuk disimpan.'); return; }
  await doSave();
}

async function doSave() {
  if (!SCRIPT_URL) { alert('URL belum ditetapkan.'); return; }
  setSync('busy', 'Menyimpan...');
  try {
    // 保存前，为当前选中的行更新最终的 THIS AL/SL REMAIN 值，防止存错
    const payload = allRows.map(r => {
      const o = {};
      SHEET_HEADERS.forEach(h => {
         if (h === 'THIS AL REMAIN' || h === 'THIS SL REMAIN') {
             // 如果是单个人保存，存他的数值，否则留空交由排版展示
             o[h] = r[h]; 
         } else {
             o[h] = r[h] === undefined || r[h] === null ? '' : r[h];
         }
      });
      return o;
    });
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveSheetData', rows: payload })
    });
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message || 'Gagal');
    dirty = false;
    setSync('ok', 'Disimpan (' + payload.length + ' baris)');
  } catch (err) {
    console.error(err);
    setSync('err', 'Gagal simpan: ' + err.message);
    alert('❌ Gagal simpan: ' + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  loadSavedUrl();
  if (SCRIPT_URL) loadData();
  else setSync('err', 'URL belum ditetapkan');
});
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
