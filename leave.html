<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll · Timesheet Calculation</title>
    <!-- SheetJS 用于导入/导出 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1e293b; padding: 24px; }
        .container { max-width: 1500px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); padding: 24px 28px 32px; }
        h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; color: #0f172a; display: flex; align-items: center; gap: 12px; }
        h1 small { font-size: 13px; font-weight: 400; color: #64748b; background: #f1f5f9; padding: 4px 12px; border-radius: 20px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0 24px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .toolbar button, .toolbar label.file-label { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #d1d9e6; background: #ffffff; color: #1e293b; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
        .toolbar button:hover, .toolbar label.file-label:hover { background: #f8fafc; border-color: #94a3b8; }
        .toolbar button.primary { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .toolbar button.primary:hover { background: #1d4ed8; }
        .toolbar button.template { background: #10b981; border-color: #10b981; color: #ffffff; }
        .toolbar button.template:hover { background: #059669; }
        .toolbar button.danger { border-color: #fca5a5; color: #dc2626; }
        .toolbar button.danger:hover { background: #fef2f2; border-color: #f87171; }
        .toolbar .spacer { flex: 1; }
        .toolbar .summary-badge { font-size: 13px; color: #475569; background: #f1f5f9; padding: 6px 14px; border-radius: 20px; border: 1px solid #e2e8f0; }
        input[type="file"] { display: none; }

        .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1400px; }
        thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        thead th { padding: 10px 8px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: #475569; text-align: center; white-space: nowrap; border-right: 1px solid #e9eef4; position: sticky; top: 0; background: #f8fafc; z-index: 2; }
        thead th:first-child { text-align: left; padding-left: 14px; }
        thead th:last-child { border-right: none; }
        thead th .sub { display: block; font-weight: 400; font-size: 10px; color: #94a3b8; text-transform: none; letter-spacing: 0; margin-top: 2px; }

        tbody td { padding: 8px 8px; border-bottom: 1px solid #f1f5f9; border-right: 1px solid #f1f5f9; text-align: center; vertical-align: middle; white-space: nowrap; }
        tbody td:first-child { text-align: left; padding-left: 14px; font-weight: 500; }
        tbody td:last-child { border-right: none; }
        tbody tr:hover { background: #fafbfc; }

        td.date-cell { min-width: 100px; font-size: 12px; }
        td.name-cell { min-width: 140px; }

        .time-input { width: 64px; padding: 5px 4px; font-size: 12px; text-align: center; border: 1px solid transparent; border-radius: 5px; background: transparent; font-family: 'Inter', monospace; transition: all 0.15s; }
        .time-input:hover { border-color: #cbd5e1; background: #fff; }
        .time-input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .time-input::placeholder { color: #cbd5e1; font-size: 11px; }

        .status-select { padding: 5px 6px; font-size: 12px; font-weight: 500; border-radius: 6px; border: 1px solid #d1d9e6; background: #ffffff; color: #1e293b; cursor: pointer; transition: all 0.15s; width: 150px; }
        .status-select:hover { border-color: #94a3b8; }
        .status-select:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .status-select[data-status="AL"] { background: #fef9c3; border-color: #fde047; color: #854d0e; }
        .status-select[data-status="SL"] { background: #ffedd5; border-color: #fdba74; color: #9a3412; }
        .status-select[data-status="UL"] { background: #fecaca; border-color: #f87171; color: #991b1b; }
        .status-select[data-status="HAL"] { background: #e0f2fe; border-color: #7dd3fc; color: #075985; }
        .status-select[data-status="L"] { background: #f3e8ff; border-color: #d8b4fe; color: #6b21a8; }
        .status-select[data-status="OFF"] { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }

        td.calc-cell { font-weight: 600; color: #0f172a; font-size: 13px; min-width: 70px; }
        td.calc-cell.ot { color: #d97706; }
        td.calc-cell.absent { color: #dc2626; }

        tbody tr.row-overtime { background: #fffbeb; }
        tbody tr.row-absent { background: #fef2f2; }

        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state p { margin-top: 8px; font-size: 14px; }

        tfoot { background: #f8fafc; font-weight: 600; border-top: 2px solid #e2e8f0; }
        tfoot td { padding: 12px 8px; font-size: 13px; color: #0f172a; text-align: center; border-right: 1px solid #e9eef4; }
        tfoot td:first-child { text-align: left; padding-left: 14px; font-weight: 600; }
        tfoot td:last-child { border-right: none; }
        tfoot .total-label { color: #475569; font-weight: 500; font-size: 12px; }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .container { padding: 16px; }
            h1 { font-size: 18px; flex-wrap: wrap; }
            .toolbar { gap: 8px; }
            .toolbar button, .toolbar label.file-label { font-size: 12px; padding: 7px 12px; }
        }

        .table-wrap::-webkit-scrollbar { height: 8px; }
        .table-wrap::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-wrap::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <h1>
        Payroll · Timesheet Calculation
        <small id="recordCount">0 rows</small>
    </h1>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
        <label class="file-label" for="fileInput">
            📂 Import Timesheet
        </label>
        <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">

        <button class="template" id="downloadTemplateBtn">📄 Download Template</button>
        <button class="primary" id="addRowBtn">+ Add Row</button>
        <button class="danger" id="clearBtn">🗑 Clear All</button>

        <div class="spacer"></div>

        <span class="summary-badge" id="summaryBadge">Total Work: 0.00h</span>
        <button id="exportBtn">📥 Export CSV</button>
    </div>

    <!-- ===== 表格 ===== -->
    <div class="table-wrap">
        <table id="timesheetTable">
            <thead>
                <tr>
                    <th style="width:40px;">#</th>
                    <th>Person ID</th>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Clock In<span class="sub">AM</span></th>
                    <th>Clock Out<span class="sub">AM</span></th>
                    <th>Clock In<span class="sub">PM</span></th>
                    <th>Clock Out<span class="sub">PM</span></th>
                    <th>Clock In<span class="sub">OT</span></th>
                    <th>Clock Out<span class="sub">OT</span></th>
                    <th>Status<span class="sub">AL/L/HAL/SL/UL/OFF</span></th>
                    <th>Work Hrs</th>
                    <th>OT Hrs</th>
                    <th>Late/Early</th>
                    <th>Remark</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 动态填充 -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="11" style="text-align:right;font-weight:500;color:#475569;">TOTAL</td>
                    <td id="totalWork">0.00</td>
                    <td id="totalOT">0.00</td>
                    <td id="totalLate">0.00</td>
                    <td></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    // ============================================================
    //  DATA LAYER
    // ============================================================
    let rows = []; // 内部数据结构

    // ============================================================
    //  DOM REFS
    // ============================================================
    const tbody = document.getElementById('tableBody');
    const recordCount = document.getElementById('recordCount');
    const summaryBadge = document.getElementById('summaryBadge');
    const totalWorkEl = document.getElementById('totalWork');
    const totalOTEl = document.getElementById('totalOT');
    const totalLateEl = document.getElementById('totalLate');
    const fileInput = document.getElementById('fileInput');

    // ============================================================
    //  HELPERS
    // ============================================================
    function generateId() {
        return 'r_' + Math.random().toString(36).slice(2, 9);
    }

    function timeToMinutes(str) {
        if (!str) return null;
        const s = String(str).trim();
        const m = s.match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        const h = parseInt(m[1], 10);
        const min = parseInt(m[2], 10);
        if (h > 23 || min > 59) return null;
        return h * 60 + min;
    }

    function minutesToHoursStr(minutes) {
        if (minutes === null || minutes < 0) return '0.00';
        return (minutes / 60).toFixed(2);
    }

    function calcDuration(inMin, outMin) {
        if (inMin === null || outMin === null) return 0;
        let d = outMin - inMin;
        if (d < 0) d += 24 * 60;
        return d;
    }

    const STATUS_OPTIONS = [
        { value: 'AL',  label: 'AL - Annual Leave' },
        { value: 'L',   label: 'L - Leave' },
        { value: 'HAL', label: 'HAL - Half Day Leave' },
        { value: 'SL',  label: 'SL - Sick Leave' },
        { value: 'UL',  label: 'UL - Unpaid Leave' },
        { value: 'OFF', label: 'OFF - Off Day' },
    ];

    // ============================================================
    //  CORE CALCULATION
    // ============================================================
    function computeRow(row) {
        const inAM = timeToMinutes(row.clockInAM);
        const outAM = timeToMinutes(row.clockOutAM);
        const inPM = timeToMinutes(row.clockInPM);
        const outPM = timeToMinutes(row.clockOutPM);
        const inOT = timeToMinutes(row.clockInOT);
        const outOT = timeToMinutes(row.clockOutOT);

        const status = (row.status || '').toUpperCase();

        let workMin = 0;
        let otMin = 0;
        let lateMin = 0;
        let absent = false;

        if (['AL', 'SL', 'UL', 'OFF'].includes(status)) {
            workMin = 0;
            otMin = 0;
            lateMin = 0;
            absent = (status === 'UL');
        } else {
            const amDur = calcDuration(inAM, outAM);
            const pmDur = calcDuration(inPM, outPM);
            const otDur = calcDuration(inOT, outOT);

            let totalSpan = amDur + pmDur;

            if (inAM !== null && outAM !== null && inPM !== null && outPM !== null) {
                totalSpan = Math.max(0, totalSpan - 60); // 扣除1小时午休
            }

            if (status === 'HAL') {
                totalSpan = Math.max(amDur, pmDur); // 半天取较长的一段
            }

            workMin = totalSpan;
            otMin = otDur;

            const STD_START = 8 * 60;
            const STD_END = 17 * 60;
            if (inAM !== null && inAM > STD_START + 30) {
                lateMin += inAM - (STD_START + 30);
            }
            if (inPM !== null && inPM > 13 * 60) {
                lateMin += inPM - 13 * 60;
            }
            if (outPM !== null && outPM < STD_END) {
                lateMin += STD_END - outPM;
            }
        }

        return { workMinutes: workMin, otMinutes: otMin, lateMinutes: lateMin, absent: absent };
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function render() {
        tbody.innerHTML = '';

        if (rows.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="15">
                        <div class="empty-state">
                            <div style="font-size:36px;margin-bottom:8px;">📋</div>
                            <p>No data yet. Import a Timesheet or click <strong>+ Add Row</strong>.</p>
                        </div>
                    </td>
                </tr>
            `;
            recordCount.textContent = '0 rows';
            summaryBadge.textContent = 'Total Work: 0.00h';
            totalWorkEl.textContent = '0.00';
            totalOTEl.textContent = '0.00';
            totalLateEl.textContent = '0.00';
            return;
        }

        let totalWorkMin = 0;
        let totalOTMin = 0;
        let totalLateMin = 0;

        rows.forEach((row, index) => {
            const calc = computeRow(row);
            totalWorkMin += calc.workMinutes;
            totalOTMin += calc.otMinutes;
            totalLateMin += calc.lateMinutes;

            const tr = document.createElement('tr');
            if (calc.otMinutes > 0) tr.classList.add('row-overtime');
            if (calc.absent) tr.classList.add('row-absent');

            const statusVal = (row.status || '').toUpperCase();

            let statusOptionsHtml = `<option value="" ${!statusVal ? 'selected' : ''}>— Select —</option>`;
            STATUS_OPTIONS.forEach(opt => {
                const sel = (opt.value === statusVal) ? 'selected' : '';
                statusOptionsHtml += `<option value="${opt.value}" ${sel}>${opt.label}</option>`;
            });

            // 合并 First Name 和 Last Name
            const fullName = [row.firstName, row.lastName].filter(Boolean).join(' ');

            tr.innerHTML = `
                <td style="color:#94a3b8;font-size:12px;">${index + 1}</td>
                <td>${escapeHtml(row.personId || '')}</td>
                <td class="name-cell">${escapeHtml(fullName)}</td>
                <td class="date-cell">${escapeHtml(row.date || '')}</td>
                <td><input class="time-input" data-field="clockInAM" value="${escapeHtml(row.clockInAM || '')}" placeholder="08:00"></td>
                <td><input class="time-input" data-field="clockOutAM" value="${escapeHtml(row.clockOutAM || '')}" placeholder="12:00"></td>
                <td><input class="time-input" data-field="clockInPM" value="${escapeHtml(row.clockInPM || '')}" placeholder="13:00"></td>
                <td><input class="time-input" data-field="clockOutPM" value="${escapeHtml(row.clockOutPM || '')}" placeholder="17:00"></td>
                <td><input class="time-input" data-field="clockInOT" value="${escapeHtml(row.clockInOT || '')}" placeholder="--"></td>
                <td><input class="time-input" data-field="clockOutOT" value="${escapeHtml(row.clockOutOT || '')}" placeholder="--"></td>
                <td>
                    <select class="status-select" data-field="status" data-status="${statusVal}">
                        ${statusOptionsHtml}
                    </select>
                </td>
                <td class="calc-cell ${calc.workMinutes === 0 ? 'absent' : ''}">${minutesToHoursStr(calc.workMinutes)}</td>
                <td class="calc-cell ${calc.otMinutes > 0 ? 'ot' : ''}">${minutesToHoursStr(calc.otMinutes)}</td>
                <td class="calc-cell ${calc.lateMinutes > 0 ? 'absent' : ''}">${minutesToHoursStr(calc.lateMinutes)}</td>
                <td><input class="time-input" style="width:100px;text-align:left;" data-field="remark" value="${escapeHtml(row.remark || '')}" placeholder="—"></td>
            `;

            tr.querySelectorAll('.time-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const field = e.target.dataset.field;
                    row[field] = e.target.value.trim();
                    render();
                });
            });

            tr.querySelector('.status-select').addEventListener('change', (e) => {
                row.status = e.target.value;
                render();
            });

            tbody.appendChild(tr);
        });

        recordCount.textContent = rows.length + ' rows';
        summaryBadge.textContent = `Total Work: ${minutesToHoursStr(totalWorkMin)}h`;
        totalWorkEl.textContent = minutesToHoursStr(totalWorkMin);
        totalOTEl.textContent = minutesToHoursStr(totalOTMin);
        totalLateEl.textContent = minutesToHoursStr(totalLateMin);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            if (m === '"') return '&quot;';
            return m;
        });
    }

    // ============================================================
    //  DOWNLOAD TEMPLATE (完全匹配 Timesheet Report 列名)
    // ============================================================
    document.getElementById('downloadTemplateBtn').addEventListener('click', function() {
        const headers = [
            'Person ID', 'First Name', 'Last Name', 'Date', 'Timesheet',
            'Clock In', 'Clock Out', 'Clock Time(h)',
            'Clock In', 'Clock Out', 'Clock Time(h)',
            'Clock In', 'Clock Out', 'Clock Time(h)',
            'Total Break Time(h)', 'Total Work Time(h)', 'Total Overtime Time(h)',
            'Statistic Rule Mode', 'Abnormal Situation'
        ];

        // 示例数据：正常、加班、缺勤
        const sampleRows = [
            ['0001', 'YANG', 'PING', '2025-10-01', '8', '08:00', '12:00', '4.00', '13:00', '17:00', '4.00', '', '', '', '1.00', '8.00', '0.00', 'Even and Odd', ''],
            ['0002', 'TAN', 'XIAO MING', '2025-10-01', '9', '08:30', '12:00', '3.50', '13:00', '17:00', '4.00', '18:00', '20:00', '2.00', '0.50', '9.50', '2.00', 'Even and Odd', 'Missed Punch'],
            ['0003', 'SITI', 'NURHALIZA', '2025-10-01', '8', '08:00', '12:00', '4.00', '13:00', '17:00', '4.00', '', '', '', '1.00', '8.00', '0.00', 'Even and Odd', 'Absent']
        ];

        const wsData = [headers, ...sampleRows];
        const ws = XLSX.utils.aoa_to_sheet(wsData);

        ws['!cols'] = [
            { wch: 12 }, { wch: 15 }, { wch: 15 }, { wch: 12 }, { wch: 10 },
            { wch: 12 }, { wch: 12 }, { wch: 12 },
            { wch: 12 }, { wch: 12 }, { wch: 12 },
            { wch: 12 }, { wch: 12 }, { wch: 12 },
            { wch: 18 }, { wch: 18 }, { wch: 20 },
            { wch: 18 }, { wch: 18 }
        ];

        const instructions = [
            ['Timesheet Template — Instructions'],
            [''],
            ['1. Fill in one row per employee per day.'],
            ['2. Date format: YYYY-MM-DD (e.g. 2025-10-01).'],
            ['3. Time format: HH:MM (e.g. 08:00, 17:30). Use 24-hour format.'],
            ['4. Columns "Clock In", "Clock Out" appear 3 times:'],
            ['   - 1st group: AM session (e.g. 08:00 - 12:00)'],
            ['   - 2nd group: PM session (e.g. 13:00 - 17:00)'],
            ['   - 3rd group: Overtime (OT) session (if applicable)'],
            ['5. "Abnormal Situation" column accepts:'],
            ['   AL  - Annual Leave'],
            ['   L   - Leave'],
            ['   HAL - Half Day Leave'],
            ['   SL  - Sick Leave'],
            ['   UL  - Unpaid Leave'],
            ['   OFF - Off Day'],
            ['6. You may also write the full label (e.g. "AL - Annual Leave").'],
            ['7. Import this file via "Import Timesheet" once filled.'],
        ];
        const ws2 = XLSX.utils.aoa_to_sheet(instructions);
        ws2['!cols'] = [{ wch: 70 }];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Timesheet');
        XLSX.utils.book_append_sheet(wb, ws2, 'Instructions');
        XLSX.writeFile(wb, 'Timesheet_Report_Template.xlsx');
    });

    // ============================================================
    //  IMPORT EXCEL (按列索引提取，适配重复列名)
    // ============================================================
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                
                // 按行读取，避免列名重复导致解析问题
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                if (jsonData.length < 2) {
                    alert('File is empty or has no data rows.');
                    return;
                }

                // 寻找表头行
                let headerRowIndex = 0;
                for (let i = 0; i < Math.min(jsonData.length, 5); i++) {
                    const rowStr = jsonData[i].join(' ').toLowerCase();
                    if (rowStr.includes('person') || rowStr.includes('id') || rowStr.includes('name')) {
                        headerRowIndex = i;
                        break;
                    }
                }

                const newRows = [];
                // 遍历数据行
                for (let i = headerRowIndex + 1; i < jsonData.length; i++) {
                    const r = jsonData[i];
                    if (!r || r.length === 0) continue;
                    // 跳过全空行
                    if (r.every(c => String(c).trim() === '')) continue;

                    // 基于你提供的截图，列索引是固定的
                    // 0: Person ID, 1: First Name, 2: Last Name, 3: Date, 4: Timesheet
                    // 5: Clock In, 6: Clock Out, 7: Clock Time(h)
                    // 8: Clock In, 9: Clock Out, 10: Clock Time(h)
                    // 11: Clock In, 12: Clock Out, 13: Clock Time(h)
                    // 14: Total Break, 15: Total Work, 16: Total OT
                    // 17: Statistic Rule, 18: Abnormal Situation

                    const personId = String(r[0] || '').trim();
                    const firstName = String(r[1] || '').trim();
                    const lastName = String(r[2] || '').trim();
                    const date = String(r[3] || '').trim();
                    
                    // 第一组打卡 (AM)
                    const clockInAM = parseTimeValue(r[5]);
                    const clockOutAM = parseTimeValue(r[6]);
                    
                    // 第二组打卡 (PM)
                    const clockInPM = parseTimeValue(r[8]);
                    const clockOutPM = parseTimeValue(r[9]);
                    
                    // 第三组打卡 (OT)
                    const clockInOT = parseTimeValue(r[11]);
                    const clockOutOT = parseTimeValue(r[12]);

                    // Abnormal Situation 映射为状态
                    let status = '';
                    const rawStatus = String(r[18] || '').trim().toUpperCase();
                    status = mapStatus(rawStatus);

                    if (personId || firstName || lastName) {
                        newRows.push({
                            id: generateId(),
                            personId,
                            firstName,
                            lastName,
                            date,
                            clockInAM: clockInAM || '',
                            clockOutAM: clockOutAM || '',
                            clockInPM: clockInPM || '',
                            clockOutPM: clockOutPM || '',
                            clockInOT: clockInOT || '',
                            clockOutOT: clockOutOT || '',
                            status,
                            remark: ''
                        });
                    }
                }

                if (newRows.length === 0) {
                    alert('No valid rows found. Please check the file format.');
                    return;
                }

                // 可以追加或替换数据
                if (rows.length > 0) {
                    if (confirm('Do you want to replace the current data or append?')) {
                        rows = newRows;
                    } else {
                        rows = rows.concat(newRows);
                    }
                } else {
                    rows = newRows;
                }
                
                render();
                alert(`✅ Imported ${newRows.length} rows successfully.`);

            } catch (err) {
                console.error(err);
                alert('Error reading file: ' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
        fileInput.value = '';
    });

    function mapStatus(raw) {
        if (!raw) return '';
        const s = raw.toUpperCase();
        if (s.includes('ABSENT') || s.includes('MISSED PUNCH')) return 'UL'; // 将缺卡/缺勤映射为 UL
        if (s.startsWith('HAL')) return 'HAL';
        if (s.startsWith('AL'))  return 'AL';
        if (s.startsWith('SL'))  return 'SL';
        if (s.startsWith('UL'))  return 'UL';
        if (s.startsWith('OFF')) return 'OFF';
        if (s.startsWith('L'))   return 'L';
        if (s.includes('ANNUAL'))  return 'AL';
        if (s.includes('SICK'))    return 'SL';
        if (s.includes('UNPAID'))  return 'UL';
        if (s.includes('HALF'))    return 'HAL';
        if (s.includes('OFF'))     return 'OFF';
        return '';
    }

    function parseTimeValue(val) {
        if (val === null || val === undefined || val === '') return '';
        const s = String(val).trim();
        if (/^\d{1,2}:\d{2}$/.test(s)) return s;
        const num = parseFloat(s);
        if (!isNaN(num) && num >= 0 && num < 1) {
            const totalMinutes = Math.round(num * 24 * 60);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
        const match12 = s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
        if (match12) {
            let h = parseInt(match12[1], 10);
            const m = parseInt(match12[2], 10);
            const ampm = match12[3].toUpperCase();
            if (ampm === 'PM' && h < 12) h += 12;
            if (ampm === 'AM' && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }
        return s;
    }

    // ============================================================
    //  ADD ROW
    // ============================================================
    document.getElementById('addRowBtn').addEventListener('click', function() {
        rows.push({
            id: generateId(),
            personId: '',
            firstName: '',
            lastName: '',
            date: new Date().toISOString().slice(0, 10),
            clockInAM: '',
            clockOutAM: '',
            clockInPM: '',
            clockOutPM: '',
            clockInOT: '',
            clockOutOT: '',
            status: '',
            remark: ''
        });
        render();
        setTimeout(() => {
            const lastRow = tbody.lastElementChild;
            if (lastRow) lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
    });

    // ============================================================
    //  CLEAR
    // ============================================================
    document.getElementById('clearBtn').addEventListener('click', function() {
        if (rows.length === 0) return;
        if (confirm('Clear all data? This cannot be undone.')) {
            rows = [];
            render();
        }
    });

    // ============================================================
    //  EXPORT CSV
    // ============================================================
    document.getElementById('exportBtn').addEventListener('click', function() {
        if (rows.length === 0) {
            alert('No data to export.');
            return;
        }

        const headers = ['Person ID', 'Name', 'Date', 'Clock In (AM)', 'Clock Out (AM)', 'Clock In (PM)', 'Clock Out (PM)', 'Clock In (OT)', 'Clock Out (OT)', 'Status', 'Work Hrs', 'OT Hrs', 'Late/Early', 'Remark'];
        const csvRows = [headers.join(',')];

        rows.forEach(row => {
            const calc = computeRow(row);
            const statusLabel = STATUS_OPTIONS.find(o => o.value === row.status)?.label || row.status || '';
            const fullName = [row.firstName, row.lastName].filter(Boolean).join(' ');
            const vals = [
                csvEscape(row.personId),
                csvEscape(fullName),
                csvEscape(row.date),
                csvEscape(row.clockInAM),
                csvEscape(row.clockOutAM),
                csvEscape(row.clockInPM),
                csvEscape(row.clockOutPM),
                csvEscape(row.clockInOT),
                csvEscape(row.clockOutOT),
                csvEscape(statusLabel),
                minutesToHoursStr(calc.workMinutes),
                minutesToHoursStr(calc.otMinutes),
                minutesToHoursStr(calc.lateMinutes),
                csvEscape(row.remark)
            ];
            csvRows.push(vals.join(','));
        });

        const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'timesheet_calculation_' + new Date().toISOString().slice(0, 10) + '.csv';
        link.click();
        URL.revokeObjectURL(link.href);
    });

    function csvEscape(val) {
        if (val === null || val === undefined) return '';
        const s = String(val);
        if (s.includes(',') || s.includes('"') || s.includes('\n')) {
            return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
    }

    // ============================================================
    //  INIT
    // ============================================================
    render();
</script>
</body>
