<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
        background: linear-gradient(160deg, #eef2f7 0%, #e6ecf5 40%, #f3f6fb 100%);
        color: #1e293b;
        padding: 28px 20px;
        min-height: 100vh;
    }
    .container {
        max-width: 1800px; margin: 0 auto;
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(8px);
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10), 0 2px 8px rgba(15,23,42,0.04);
        border: 1px solid rgba(255,255,255,0.7);
        padding: 0 0 28px;
        overflow: hidden;
    }

    /* ===== 品牌栏 ===== */
    .brandbar {
        display: flex; align-items: center; gap: 14px;
        padding: 22px 30px;
        background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
        color: #fff;
    }
    .brandbar .logo {
        width: 46px; height: 46px; border-radius: 14px;
        background: rgba(255,255,255,0.18);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .brandbar .titles { display: flex; flex-direction: column; gap: 2px; }
    .brandbar .titles .kicker {
        font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
        color: rgba(255,255,255,0.72); font-weight: 600;
    }
    .brandbar .titles h1 {
        font-size: 21px; font-weight: 700; letter-spacing: -0.3px;
        display: flex; align-items: center; gap: 10px;
    }
    .brandbar .titles h1 small {
        font-size: 11.5px; font-weight: 500;
        background: rgba(255,255,255,0.18);
        color: #fff; padding: 4px 11px; border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.25);
    }
    .brandbar .spacer { flex: 1; }
    .brandbar .stat-pill {
        display: inline-flex; align-items: center; gap: 7px;
        background: rgba(255,255,255,0.16);
        border: 1px solid rgba(255,255,255,0.25);
        padding: 7px 14px; border-radius: 30px;
        font-size: 12.5px; font-weight: 500;
        color: #f8fafc;
        white-space: nowrap;
    }
    .brandbar .stat-pill b { font-weight: 700; color: #fff; }
    .brandbar .stat-pill .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,0.25);
    }

    /* ===== 工具栏 ===== */
    .toolbar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        margin: 22px 30px 6px;
        padding: 14px 18px;
        background: #ffffff;
        border: 1px solid #e6ebf3;
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(15,23,42,0.05);
    }
    .toolbar button, .toolbar label.file-label {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 16px; font-size: 13px; font-weight: 600;
        border-radius: 10px; border: 1px solid #dbe2ee;
        background: #ffffff; color: #1e293b;
        cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .toolbar button:hover, .toolbar label.file-label:hover {
        background: #f6f9ff; border-color: #93b4f5; transform: translateY(-1px);
    }
    .toolbar button.primary {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border-color: transparent; color: #ffffff;
        box-shadow: 0 4px 12px rgba(37,99,235,0.28);
    }
    .toolbar button.primary:hover { filter: brightness(1.06); }
    .toolbar button.template {
        background: linear-gradient(135deg, #059669, #10b981);
        border-color: transparent; color: #ffffff;
        box-shadow: 0 4px 12px rgba(16,185,129,0.25);
    }
    .toolbar button.template:hover { filter: brightness(1.06); }
    .toolbar button.danger { border-color: #fecaca; color: #dc2626; background:#fff; }
    .toolbar button.danger:hover { background: #fef2f2; border-color: #f87171; }
    .toolbar .spacer { flex: 1; }
    input[type="file"] { display: none; }

    /* ===== 表格容器 ===== */
    .table-wrap {
        margin: 18px 30px 0;
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid #e6ebf3;
        background: #ffffff;
        box-shadow: 0 6px 22px rgba(15,23,42,0.05);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1900px; }

    thead { background: linear-gradient(180deg, #f8fafc, #f1f5fb); }
    thead th {
        padding: 10px 6px; font-weight: 600; font-size: 10.5px;
        text-transform: uppercase; letter-spacing: 0.4px;
        color: #475569; text-align: center; white-space: nowrap;
        border-right: 1px solid #e9eef4; border-bottom: 2px solid #e2e8f0;
        position: sticky; top: 0; background: #f8fafc; z-index: 2;
    }
    thead th:first-child { text-align: left; padding-left: 14px; }
    thead th:last-child { border-right: none; }
    thead th .sub {
        display: block; font-weight: 500; font-size: 9.5px;
        color: #94a3b8; text-transform: none; letter-spacing: 0;
        margin-top: 2px;
    }

    tbody td {
        padding: 6px 4px; border-bottom: 1px solid #f1f5f9;
        border-right: 1px solid #f4f7fb; text-align: center;
        vertical-align: middle; white-space: nowrap;
    }
    tbody td:first-child {
        text-align: left; padding-left: 14px; font-weight: 600;
        color: #94a3b8; font-size: 12px;
    }
    tbody td:last-child { border-right: none; }
    tbody tr:nth-child(even) { background: #fbfcfe; }
    tbody tr:hover { background: #eef4ff; }

    /* ===== 输入控件 ===== */
    .time-input {
        width: 62px; padding: 6px 3px; font-size: 12px; text-align: center;
        border: 1px solid transparent; border-radius: 7px;
        background: transparent; font-family: 'Inter', monospace;
        transition: all 0.15s; color: #0f172a;
    }
    .time-input:hover { border-color: #cbd5e1; background: #fff; }
    .time-input:focus {
        outline: none; border-color: #2563eb; background: #fff;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
    }
    .time-input::placeholder { color: #cbd5e1; font-size: 11px; }

    .text-input {
        width: 90px; padding: 6px; font-size: 12px; text-align: left;
        border: 1px solid transparent; border-radius: 7px;
        background: transparent; transition: all 0.15s; color: #0f172a;
    }
    .text-input:hover { border-color: #cbd5e1; background: #fff; }
    .text-input:focus {
        outline: none; border-color: #2563eb; background: #fff;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
    }
    .text-input.wide { width: 130px; }
    .text-input.id { width: 80px; font-weight: 600; }

    .status-select {
        padding: 6px 8px; font-size: 12px; font-weight: 600;
        border-radius: 8px; border: 1px solid #dbe2ee;
        background: #ffffff; color: #1e293b; cursor: pointer;
        transition: all 0.15s; width: 150px;
    }
    .status-select:hover { border-color: #93b4f5; }
    .status-select:focus {
        outline: none; border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.14);
    }
    .status-select[data-status="AL"]  { background:#fef9c3; border-color:#fde047; color:#854d0e; }
    .status-select[data-status="SL"]  { background:#ffedd5; border-color:#fdba74; color:#9a3412; }
    .status-select[data-status="UL"]  { background:#fecaca; border-color:#f87171; color:#991b1b; }
    .status-select[data-status="HAL"] { background:#e0f2fe; border-color:#7dd3fc; color:#075985; }
    .status-select[data-status="L"]   { background:#f3e8ff; border-color:#d8b4fe; color:#6b21a8; }
    .status-select[data-status="OFF"] { background:#f1f5f9; border-color:#cbd5e1; color:#64748b; }

    /* ===== 计算列 ===== */
    td.calc-cell {
        font-weight: 700; color: #0f172a; font-size: 12.5px;
        background: #f6f9ff;
    }
    td.calc-cell.seg { font-weight: 600; color: #2563eb; background: #f3f7ff; font-size: 12px; }
    td.calc-cell.break { color: #0369a1; background: #f0f7ff; }
    td.calc-cell.ot { color: #d97706; }
    td.calc-cell.absent { color: #dc2626; }

    tbody tr.row-overtime { background: #fffbeb !important; }
    tbody tr.row-absent { background: #fef2f2 !important; }

    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .empty-state p { margin-top: 8px; font-size: 14px; }

    /* ===== 表尾合计 ===== */
    tfoot { background: linear-gradient(180deg,#f8fafc,#eef2f8); border-top: 2px solid #e2e8f0; }
    tfoot td {
        padding: 13px 4px; font-size: 12.5px; color: #0f172a;
        text-align: center; border-right: 1px solid #e9eef4; font-weight: 700;
    }
    tfoot td:first-child { text-align: right; padding-right: 10px; }
    tfoot td:last-child { border-right: none; }
    tfoot .total-label { color: #475569; font-weight: 600; font-size: 12px; letter-spacing: 0.4px; }

    @media (max-width: 768px) {
        body { padding: 12px; }
        .brandbar { padding: 16px 18px; flex-wrap: wrap; }
        .brandbar .titles h1 { font-size: 17px; }
        .toolbar { margin: 14px 16px 6px; gap: 8px; }
        .toolbar button, .toolbar label.file-label { font-size: 12px; padding: 7px 12px; }
        .table-wrap { margin: 14px 16px 0; }
    }

    .table-wrap::-webkit-scrollbar { height: 9px; }
    .table-wrap::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
