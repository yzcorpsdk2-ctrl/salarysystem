<script>
/* ============================================================
   顶部导航栏：下拉菜单 + 高度同步
   ============================================================ */
function syncNavHeight() {
  const nav = document.getElementById('mainNav');
  if (!nav) return;
  document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
}
function closeAllNavDropdowns() {
  document.querySelectorAll('.nav-dropdown.open').forEach(x => x.classList.remove('open'));
}

document.querySelectorAll('.nav-dropdown').forEach(dd => {
  const trigger = dd.querySelector('.nav-item');
  if (!trigger) return;
  trigger.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(x => x.classList.remove('open'));
    if (!wasOpen) dd.classList.add('open');
  });
});
document.addEventListener('click', e => {
  if (!e.target.closest('.nav-dropdown')) {
    document.querySelectorAll('.nav-dropdown.open').forEach(x => x.classList.remove('open'));
  }
  if (!e.target.closest('.toolbar-dropdown')) {
    document.querySelectorAll('.toolbar-dropdown.open').forEach(x => x.classList.remove('open'));
  }
});

/* ============================================================
   Toolbar 下拉菜单（PRINT）
   ============================================================ */
function toggleToolbarDropdown(id, e) {
  if (e) e.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.toolbar-dropdown.open').forEach(x => x.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
function closeAllToolbarDropdowns() {
  document.querySelectorAll('.toolbar-dropdown.open').forEach(x => x.classList.remove('open'));
}

/* ============================================================
   REQUEST CHAT · 在线 AI 助手
   ============================================================ */
const CHAT_WELCOME =
  '👋 你好！我是 Payroll AI 助手。\n' +
  '我可以帮你解答：EPF / SOCSO / EIS / 24JAM 计算、OT 加班、借粮 Pinjaman、\n' +
  '保存到 Sheet、导入导出、粮单打印等等。\n\n' +
  '直接输入问题，或点下方快捷按钮 👇';

let chatBusy = false;

function toggleChat() {
  const panel = document.getElementById('chatPanel');
  if (panel.classList.contains('open')) closeChat(); else openChat();
}
function openChat() {
  const panel = document.getElementById('chatPanel');
  panel.classList.add('open');
  const body = document.getElementById('chatBody');
  if (!body.dataset.inited) {
    body.dataset.inited = '1';
    addChatMsg('bot', CHAT_WELCOME);
  }
  setTimeout(() => {
    const inp = document.getElementById('chatInput');
    if (inp && window.innerWidth > 768) inp.focus();
  }, 150);
}
function closeChat() {
  document.getElementById('chatPanel').classList.remove('open');
}
function clearChat() {
  const body = document.getElementById('chatBody');
  body.innerHTML = '';
  addChatMsg('bot', CHAT_WELCOME);
}
function addChatMsg(role, text) {
  const body = document.getElementById('chatBody');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}
function addTyping() {
  const body = document.getElementById('chatBody');
  const div = document.createElement('div');
  div.className = 'chat-msg bot typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}
function askChat(q) {
  const inp = document.getElementById('chatInput');
  inp.value = q;
  sendChat();
}
function sendChat() {
  const inp = document.getElementById('chatInput');
  const q = (inp.value || '').trim();
  if (!q || chatBusy) return;
  chatBusy = true;
  addChatMsg('user', q);
  inp.value = '';
  inp.style.height = 'auto';
  const typing = addTyping();
  setTimeout(() => {
    typing.remove();
    addChatMsg('bot', aiReply(q));
    chatBusy = false;
  }, 420);
}

function aiReply(q) {
  const s = String(q).toLowerCase();
  const has = (...ks) => ks.some(k => s.includes(k));
  if (has('你好', 'hi', 'hello', 'halo', '嗨')) return '你好！👋 我可以帮你解答薪资系统的问题。';
  if (has('epf', 'kwsp')) return '【EPF / KWSP 计算】\n• 55 岁以下：员工 11%，雇主 12%（月薪 ≤ RM5,000 时雇主 13%）\n• 60 岁及以上：员工 0%，雇主 4%';
  if (has('socso', 'perkeso')) return '【SOCSO / PERKESO】\n• 按缴费表计算，薪资上限 RM6,000';
  if (has('eis')) return '【EIS 就业保险】\n• 员工 0.2% + 雇主 0.2%\n• 薪资上限 RM6,000，员工最高 RM11.90';
  if (has('24jam', '24 jam', 'lindung')) return '【24 JAM LINDUNGAN】\n• 费率 0.7325%\n• 薪资上限 RM6,000';
  if (has('ot', 'overtime', '加班')) return '【OT 加班计算】\n时薪 = 月薪 ÷ 26 ÷ 8';
  if (has('pinjaman', '借粮', '借款')) return '【借粮 PINJAMAN】\n• 在 PINJAMAN 栏输入本期扣款金额';
  if (has('保存', 'sheet', 'simpan')) return '【保存资料到 Google Sheet】\n• 点「💾 Simpan ke Sheet」→ 立即写入\n• 自动同步默认关闭';
  if (has('newsession', 'new session', '新会话')) return '【New Session】\n• 自动导出 .xlsx 备份\n• 清空页面 + 清空 PayrollData\n• 重新载入 STAFF LOGIN RECORD';
  if (has('staff', '基础资料', '员工资料')) return '【员工基础资料】\n• 页面打开时自动从 STAFF LOGIN RECORD 载入\n• 包含 Situation / GroupName / Code / Name / Salary / BankNama / BankAccountNo / EPF / PERKESO / EIS';
  if (has('谢谢', 'thank', 'terima kasih')) return '不客气！😊';
  return '我暂时没有找到相关答案 🤔\n\n试试：EPF / SOCSO / EIS / 24JAM / OT / New Session';
}

window.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('chatInput');
  if (inp) {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });
    inp.addEventListener('input', () => {
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 110) + 'px';
    });
  }
});

/* ============================================================
   核心常量
   ============================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4qjdz_E3vbwwkSSV7N-TB_OU2aLQ-tUlXN0tc3Ek5fIn9yuIemVXvkf0VJA6E1f3L/exec';
const DETAIL_URL = 'https://yzcorpsdk2-ctrl.github.io/salarysystem/detail.html';
const STORAGE_KEY = 'payrollEmployees';
const SELECTED_CODE_KEY = 'payrollSelectedCode';
const SELECTED_EMP_KEY = 'payrollSelectedEmployee';

/* ============================================================
   自动同步
   ============================================================ */
const AUTO_SYNC_INTERVAL_MS = 30000;
let autoSyncTimer = null;
let autoSyncInFlight = false;
let autoSyncCount = 0;
let autoSyncLastOk = 0;
let autoSyncEnabled = false;
let staffBasics = [];

function setSyncBadge(state, text) {
  const badge = document.getElementById('syncBadge');
  const txt = document.getElementById('syncBadgeText');
  if (!badge || !txt) return;
  badge.classList.remove('ok', 'busy', 'err');
  if (state) badge.classList.add(state);
  txt.textContent = text;
}

async function autoSyncToSheet(force = false) {
  if (autoSyncInFlight && !force) return;
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    setSyncBadge('err', 'AutoSync: 未设置 URL');
    return;
  }
  if (!employees || !employees.length) return;

  autoSyncInFlight = true;
  setSyncBadge('busy', 'AutoSync: 同步中…');
  try {
    employees.forEach(emp => recalcRow(emp));
    const headers = getExportHeaders();
    const rows = getExportRows(true);
    const payload = { headers, rows };

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (result.status !== 'success') throw new Error(result.message || 'Server returned error');

    autoSyncCount++;
    autoSyncLastOk = Date.now();
    const hhmmss = new Date(autoSyncLastOk).toLocaleTimeString('zh-CN', { hour12: false });
    setSyncBadge('ok', 'AutoSync: 已同步 ' + hhmmss + ' (' + rows.length + ')');
    console.log('[AutoSync] pushed ' + rows.length + ' rows (#' + autoSyncCount + ')', result);
  } catch (err) {
    console.error('[AutoSync] failed:', err);
    const msg = (err && err.message) ? err.message : String(err);
    setSyncBadge('err', 'AutoSync: 同步失败 - ' + msg);
    if (autoSyncCount === 0) toast('⚠️ 无法同步到 Google Sheet：' + msg, false);
  } finally {
    autoSyncInFlight = false;
  }
}

function startAutoSync() {
  if (autoSyncTimer) clearInterval(autoSyncTimer);
  setSyncBadge('ok', 'AutoSync: 已开启（30s）');
  autoSyncTimer = setInterval(() => autoSyncToSheet(), AUTO_SYNC_INTERVAL_MS);
}
function stopAutoSync() {
  if (autoSyncTimer) { clearInterval(autoSyncTimer); autoSyncTimer = null; }
  setSyncBadge('', 'AutoSync: 手动模式');
}

function toggleAutoSync(enabled) {
  const sw = document.getElementById('syncSwitch');
  if (sw) sw.classList.toggle('on', enabled);
  autoSyncEnabled = !!enabled;

  if (enabled) {
    const ok = confirm(
      '⚠️ 开启自动同步（每 30 秒）\n\n' +
      '系统会持续把当前页面的数据覆盖写入 Google Sheet 的 PayrollData。\n\n' +
      '确定要开启吗？'
    );
    if (!ok) {
      const t = document.getElementById('autoSyncToggle');
      if (t) t.checked = false;
      if (sw) sw.classList.remove('on');
      autoSyncEnabled = false;
      return;
    }
    startAutoSync();
    toast('✅ 自动同步已开启（每 30 秒）');
  } else {
    stopAutoSync();
    toast('⏸️ 已切换到手动同步模式');
  }
}

/* ============================================================
   从 STAFF LOGIN RECORD 载入员工基础资料
   ============================================================ */
async function loadStaffBasics() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    setSyncBadge('', 'AutoSync: 手动模式');
    return [];
  }
  setSyncBadge('busy', '载入基础资料…');
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=staff');
    const j = await res.json();
    if (j.status !== 'success') throw new Error(j.message || '读取失败');
    const list = Array.isArray(j.data) ? j.data : [];
    console.log('[Staff] received ' + list.length + ' rows');
    if (list.length) console.log('[Staff] first row:', list[0]);
    if (!list.length) {
      setSyncBadge('', '基础资料：无数据');
      toast('⚠️ STAFF LOGIN RECORD 无资料', false);
      return [];
    }
    staffBasics = list;
    applyStaffBasicsToEmployees();
    setSyncBadge('ok', '基础资料已载入 (' + list.length + ' 人)');
    toast('✅ 已载入 ' + list.length + ' 位员工基础资料');
    return list;
  } catch (err) {
    console.error('[Staff] load failed:', err);
    setSyncBadge('err', '基础资料载入失败');
    toast('❌ 无法载入员工基础资料：' + (err.message || err), false);
    return [];
  }
}

/* 把基础资料合并到 employees（严格按列映射）
   ┌──────────────────────────────────────────────────────────┐
   │ STAFF LOGIN RECORD 列  →  HTML 页面字段                  │
   ├──────────────────────────────────────────────────────────┤
   │ Situation     (B)      →  Situation                      │
   │ GroupName     (C)      →  GroupName (Kumpulan)           │
   │ Code          (D)      →  Code (Kod)                     │
   │ Name          (E)      →  Name (Nama)                    │
   │ Salary        (I)      →  Basic (Gaji Asas)              │
   │ BankNama      (U)      →  BankNama + SLRBankNama         │
   │ BankAccountNo (V)      →  SLRBankAccountNo               │
   │ EPF           (W)      →  SLREPF                         │
   │ PERKESO       (X)      →  SLRPERKESO                     │
   │ EIS           (Y)      →  SLREIS                         │
   └──────────────────────────────────────────────────────────┘ */
function applyStaffBasicsToEmployees() {
  if (!staffBasics.length) return;

  const byCode = new Map();
  employees.forEach(e => { if (e && e.Code) byCode.set(String(e.Code).trim(), e); });

  const merged = [];
  staffBasics.forEach(b => {
    const code = String(b.Code || '').trim();
    if (!code) return;
    const sit = String(b.Situation || 'ACTIVE').trim().toUpperCase();
    if (sit === 'UNACTIVE' || sit === 'INACTIVE') return;

    const base = byCode.get(code) || {};

    const salaryFromStaff = Number(b.Salary) || 0;
    const basicFinal = salaryFromStaff > 0 ? salaryFromStaff : num(base.Basic);
    const bankFromStaff = String(b.BankNama || '').trim();

    merged.push({
      // 基础资料
      Situation:        sit,
      GroupName:        String(b.GroupName || base.GroupName || ''),
      Code:             code,
      Name:             String(b.Name || base.Name || ''),
      BankNama:         bankFromStaff || base.BankNama || '',
      SLRBankNama:      bankFromStaff || base.SLRBankNama || '',
      SLRBankAccountNo: String(b.BankAccountNo || base.SLRBankAccountNo || ''),
      SLREPF:           String(b.EPF || base.SLREPF || ''),
      SLRPERKESO:       String(b.PERKESO || base.SLRPERKESO || ''),
      SLREIS:           String(b.EIS || base.SLREIS || ''),

      // 工资数据
      Basic:       basicFinal,
      Allowance:   num(base.Allowance),
      Allowance2:  num(base.Allowance2),
      Commission:  num(base.Commission),
      Incentives:  num(base.Incentives),
      EPFSalary:   (base.EPFSalary   === undefined || base.EPFSalary   === null) ? '' : base.EPFSalary,
      SOCSOSalary: (base.SOCSOSalary === undefined || base.SOCSOSalary === null) ? '' : base.SOCSOSalary,
      EISSalary:   (base.EISSalary   === undefined || base.EISSalary   === null) ? '' : base.EISSalary,
      LindungSalary: (base.LindungSalary === undefined || base.LindungSalary === null) ? '' : base.LindungSalary,
      NormalOT:    num(base.NormalOT),
      RestOT:      num(base.RestOT),
      PublicOT:    num(base.PublicOT),
      OtherOT:     num(base.OtherOT),
      AnnualLeaveDays: num(base.AnnualLeaveDays),
      AnnualLeave:     num(base.AnnualLeave),
      UnpaidLeaveDays: num(base.UnpaidLeaveDays),
      UnpaidLeave:     num(base.UnpaidLeave),
      SickLeaveDays:   num(base.SickLeaveDays),
      SickLeave:       num(base.SickLeave),
      HalfDaysDays:    num(base.HalfDaysDays),
      HalfDays:        num(base.HalfDays),
      Pinjaman:        num(base.Pinjaman),
      Deduction:       num(base.Deduction),
      Others:          num(base.Others),
      Age:  base.Age || 30,
      EPF:  base.EPF  || 'YES',
      PERKESO: base.PERKESO || 'YES',
      EIS:  base.EIS  || 'YES',
      Lindungan: base.Lindungan || 'YES',
      EPF_Employee:   num(base.EPF_Employee),
      EPF_Employer:   num(base.EPF_Employer),
      SOCSO_Employee: num(base.SOCSO_Employee),
      SOCSO_Employer: num(base.SOCSO_Employer),
      EIS_Employee:   num(base.EIS_Employee),
      EIS_Employer:   num(base.EIS_Employer),
      Lindung24Jam:   num(base.Lindung24Jam),
      manualEPF:   !!base.manualEPF,
      manualSOCSO: !!base.manualSOCSO,
      manualEIS:   !!base.manualEIS,
      manual24JAM: !!base.manual24JAM,
      manualSLRBankNama:      !!base.manualSLRBankNama,
      manualSLRBankAccountNo: !!base.manualSLRBankAccountNo,
      manualSLREPF:           !!base.manualSLREPF,
      manualSLRPERKESO:       !!base.manualSLRPERKESO,
      manualSLREIS:           !!base.manualSLREIS
    });
  });

  employees = merged;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}
  renderTable();
  console.log('[Staff] Applied ' + merged.length + ' employees');
  if (merged.length) console.log('[Staff] Sample: ' + JSON.stringify(merged[0]));
}

/* 把 Sheet 返回的 1 行转成 employee 对象 */
function mapSheetRowToEmployee(row) {
  return {
    Situation:        String(row.Situation || 'ACTIVE').trim().toUpperCase(),
    Code:             row.Code, Name: row.Name, GroupName: row.GroupName || '',
    BankNama:         row.BankNama || row.Bank || '',
    Basic:            Number(row.Salary || row.Basic) || 0,
    Allowance:        Number(row.Allowance) || 0,
    Allowance2:       Number(row.Allowance2 !== undefined && row.Allowance2 !== '' ? row.Allowance2 : row.Allowance) || 0,
    Commission:       Number(row.Commission) || 0,
    Incentives:       Number(row.Incentives) || 0,
    EPFSalary:        row.EPFSalary   !== undefined && row.EPFSalary   !== null && row.EPFSalary   !== '' ? Number(row.EPFSalary)   : '',
    SOCSOSalary:      row.SOCSOSalary !== undefined && row.SOCSOSalary !== null && row.SOCSOSalary !== '' ? Number(row.SOCSOSalary) : '',
    EISSalary:        row.EISSalary   !== undefined && row.EISSalary   !== null && row.EISSalary   !== '' ? Number(row.EISSalary)   : '',
    LindungSalary:    row.LindungSalary !== undefined && row.LindungSalary !== null && row.LindungSalary !== '' ? Number(row.LindungSalary) : '',
    AnnualLeaveDays:  Number(row.AnnualLeaveDays) || 0,
    AnnualLeave:      Number(row.AnnualLeave) || 0,
    UnpaidLeaveDays:  Number(row.UnpaidLeaveDays) || 0,
    UnpaidLeave:      Number(row.UnpaidLeave) || 0,
    SickLeaveDays:    Number(row.SickLeaveDays) || 0,
    SickLeave:        Number(row.SickLeave) || 0,
    HalfDaysDays:     Number(row.HalfDaysDays) || 0,
    HalfDays:         Number(row.HalfDays) || 0,
    Deduction:        Number(row.Deduction) || 0,
    NormalOT:         Number(row.NormalOT) || 0,
    RestOT:           Number(row.RestOT) || 0,
    PublicOT:         Number(row.PublicOT) || 0,
    OtherOT:          Number(row.OtherOT) || 0,
    Pinjaman:         Number(row.Pinjaman) || 0,
    Others: 0, Age: 30,
    EPF: row.EPF || 'YES', PERKESO: row.PERKESO || 'YES',
    EIS: row.EIS || 'YES', Lindungan: row.Lindungan || 'YES',
    EPF_Employee:    Number(row.EPF_Employee)    || 0,
    EPF_Employer:    Number(row.EPF_Employer)    || 0,
    SOCSO_Employee:  Number(row.SOCSO_Employee)  || 0,
    SOCSO_Employer:  Number(row.SOCSO_Employer)  || 0,
    EIS_Employee:    Number(row.EIS_Employee)    || 0,
    EIS_Employer:    Number(row.EIS_Employer)    || 0,
    Lindung24Jam:    Number(row.Lindung24Jam)    || 0,
    manualEPF:   !!row.manualEPF,   manualSOCSO: !!row.manualSOCSO,
    manualEIS:   !!row.manualEIS,   manual24JAM: !!row.manual24JAM,
    SLRBankNama:      String(row.SLRBankNama || row.BankNama || row.Bank || '').trim(),
    SLRBankAccountNo: String(row.SLRBankAccountNo || row.BankAccountNo || row.BankAcc || '').trim(),
    SLREPF:           String(row.SLREPF || row.EPF || '').trim(),
    SLRPERKESO:       String(row.SLRPERKESO || row.SOCSO || row.PERKESO || '').trim(),
    SLREIS:           String(row.SLREIS || row.EIS || '').trim(),
    manualSLRBankNama: false, manualSLRBankAccountNo: false,
    manualSLREPF: false, manualSLRPERKESO: false, manualSLREIS: false
  };
}

/* ============================================================
   📥 手动：从 PayrollData 载入完整工资数据
   ============================================================ */
async function loadPayrollFromSheet() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    toast('请先设置 APPS_SCRIPT_URL', false); return;
  }
  if (!confirm(
    '从 Google Sheet 的 PayrollData 载入完整工资数据？\n\n' +
    '⚠️ 这会覆盖当前页面上的工资数据（基础资料会保留）。'
  )) return;

  setSyncBadge('busy', '载入 PayrollData…');
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const j = await res.json();
    if (j.status !== 'success' || !Array.isArray(j.data)) {
      throw new Error(j.message || '数据格式错误');
    }
    if (!j.data.length) {
      setSyncBadge('', 'PayrollData：无数据');
      toast('⚠️ PayrollData 里没有数据', false);
      return;
    }
    const fromSheet = j.data.map(mapSheetRowToEmployee).filter(e => e && e.Code);

    const basicsByCode = new Map();
    staffBasics.forEach(b => { if (b.Code) basicsByCode.set(String(b.Code).trim(), b); });

    employees = fromSheet.map(e => {
      const b = basicsByCode.get(String(e.Code).trim());
      if (b) {
        e.Situation = String(b.Situation || e.Situation || 'ACTIVE').toUpperCase();
        e.GroupName = b.GroupName || e.GroupName;
        e.Name      = b.Name      || e.Name;
        if (Number(b.Salary) > 0) e.Basic = Number(b.Salary);
        const bankFromStaff = String(b.BankNama || '').trim();
        e.BankNama         = bankFromStaff || e.BankNama;
        e.SLRBankNama      = bankFromStaff || e.SLRBankNama;
        e.SLRBankAccountNo = b.BankAccountNo || e.SLRBankAccountNo;
        e.SLREPF           = b.EPF           || e.SLREPF;
        e.SLRPERKESO       = b.PERKESO       || e.SLRPERKESO;
        e.SLREIS           = b.EIS           || e.SLREIS;
      }
      return e;
    }).filter(e => e.Situation !== 'UNACTIVE' && e.Situation !== 'INACTIVE');

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}
    renderTable();
    setSyncBadge('ok', 'PayrollData 已载入 (' + employees.length + ')');
    toast('✅ 已从 PayrollData 载入 ' + employees.length + ' 笔工资数据');
  } catch (err) {
    console.error('[Payroll] load failed:', err);
    setSyncBadge('err', '载入失败：' + (err.message || err));
    toast('❌ 载入失败：' + (err.message || err), false);
  }
}
async function reloadFromSheet() { return loadPayrollFromSheet(); }

/* ============================================================
   🆕 New Session —— 备份 + 清空页面 + 清空 Sheet + 重载基础资料
   ============================================================ */
async function resetNewSession() {
  const ok = confirm(
    '🆕 New Session 会执行以下操作：\n\n' +
    '1️⃣ 自动导出当前数据为 Excel (.xlsx) 备份\n' +
    '2️⃣ 清空当前页面所有资料（回默认状态）\n' +
    '3️⃣ 清空 Google Sheet 的 PayrollData\n' +
    '4️⃣ 重新从 STAFF LOGIN RECORD 载入基础资料\n\n' +
    '⚠️ 此操作不可撤销！确定继续吗？'
  );
  if (!ok) return;

  const btn = document.getElementById('btnNewSession');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 处理中…'; }
  setSyncBadge('busy', 'New Session 处理中…');

  // ---------- ① 导出 xlsx 备份 ----------
  try {
    if (employees && employees.length > 0) {
      exportBackupXLSX('newsession_backup');
      toast('✅ 备份已导出，正在清空…');
      await new Promise(r => setTimeout(r, 900));  // 等浏览器启动下载
    } else {
      console.log('[NewSession] 无数据可备份');
    }
  } catch (e) {
    console.error('[NewSession] 备份失败:', e);
  }

  // ---------- ② 清空 Google Sheet 的 PayrollData ----------
  let sheetCleared = false;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ headers: getExportHeaders(), rows: [] })
    });
    const j = await res.json();
    if (j.status !== 'success') throw new Error(j.message || 'clear failed');
    sheetCleared = true;
    console.log('[NewSession] Sheet cleared:', j);
  } catch (e) {
    console.error('[NewSession] Sheet 清空失败:', e);
    const cont = confirm(
      '⚠️ Google Sheet 清空失败：' + (e.message || e) +
      '\n\n是否继续清空页面？'
    );
    if (!cont) {
      if (btn) { btn.disabled = false; btn.textContent = '🆕 New Session'; }
      setSyncBadge('err', 'New Session 已中止');
      return;
    }
  }

  // ---------- ③ 清空 localStorage ----------
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SELECTED_CODE_KEY);
    localStorage.removeItem(SELECTED_EMP_KEY);
  } catch (e) {}

  // ---------- ④ 清空当前页 ----------
  employees = [];
  staffBasics = [];
  filterGroup.clear();
  filterBank.clear();
  renderTable();  // 显示"加载中…"

  // ---------- ⑤ 重新从 STAFF LOGIN RECORD 载入 ----------
  await loadStaffBasics();

  if (btn) { btn.disabled = false; btn.textContent = '🆕 New Session'; }
  if (sheetCleared) {
    setSyncBadge('ok', 'New Session 完成 (Sheet 已清空)');
    toast('✅ New Session 完成！页面 + Sheet 已清空，基础资料已重载');
  } else {
    setSyncBadge('ok', 'New Session 完成 (Sheet 未清空)');
    toast('⚠️ 页面已清空，但 Sheet 清空失败');
  }
}

/* 导出 xlsx 备份（供 New Session 使用） */
function exportBackupXLSX(prefix) {
  if (typeof XLSX === 'undefined') {
    console.warn('[Backup] XLSX 未载入，跳过备份');
    toast('⚠️ SheetJS 未载入，跳过备份', false);
    return;
  }
  const rows = getExportRows(true);
  if (!rows.length) { console.log('[Backup] 无数据，跳过'); return; }
  const aoa = [getExportHeaders(), ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = getExportHeaders().map(() => ({ wch: 14 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Payroll');
  const ts = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = ts.getFullYear() + pad(ts.getMonth()+1) + pad(ts.getDate()) +
                '_' + pad(ts.getHours()) + pad(ts.getMinutes()) + pad(ts.getSeconds());
  XLSX.writeFile(wb, (prefix || 'payroll_backup') + '_' + stamp + '.xlsx');
  console.log('[Backup] exported: ' + (prefix || 'payroll_backup') + '_' + stamp + '.xlsx');
}

}

/* ============ Sticky 偏移 ============ */
function updateStickyOffsets() {
  requestAnimationFrame(() => {
    const table = document.getElementById('mainTable');
    const thead = table && table.querySelector('thead');
    if (!thead) return;
    const sectionRow = thead.querySelector('.section-label-row');
    const mainRow    = thead.querySelector('.main-header-row');
    const subRow     = thead.querySelector('.sub-header-row');
    const filterRow  = thead.querySelector('.filter-row');
    if (!sectionRow || !mainRow || !subRow || !filterRow) return;

    const hSection = sectionRow.offsetHeight;
    const hMain    = mainRow.offsetHeight;
    const hSub     = subRow.offsetHeight;

    table.style.setProperty('--sticky-main-top',   hSection + 'px');
    table.style.setProperty('--sticky-sub-top',    (hSection + hMain) + 'px');
    table.style.setProperty('--sticky-filter-top', (hSection + hMain + hSub) + 'px');

    thead.querySelectorAll('th').forEach(th => { th.style.top = ''; });
    document.querySelectorAll('#tbody td.col-freeze').forEach(td => {
      if (td.style.top) td.style.top = '';
    });
  });
}

function onFilterChange(type, cb) {
  if (type === 'group') {
    if (cb.checked) filterGroup.add(cb.dataset.value); else filterGroup.delete(cb.dataset.value);

    if (cb.checked) filterBank.add(cb.dataset.value); else filterBank.delete(cb.dataset.value);
  }
  updateMSLabels();
  updateFilterStats();
}
function selectAllMS(type, e) {
  if (e) e.stopPropagation();
  if (type === 'group') {
    document.querySelectorAll('#msGroupList input[type=checkbox]').forEach(cb => {
      cb.checked = true; filterGroup.add(cb.dataset.value);
    });
  } else {
    document.querySelectorAll('#msBankList input[type=checkbox]').forEach(cb => {
      cb.checked = true; filterBank.add(cb.dataset.value);
    });
  }
  updateMSLabels();
  updateFilterStats();
}
function clearMS(type, e) {
  if (e) e.stopPropagation();
  if (type === 'group') {
    filterGroup.clear();

  updateMSLabels();
  updateFilterStats();
}
function updateMSLabels() {
  const txtG = document.getElementById('msGroupText');
  const txtB = document.getElementById('msBankText');
  if (filterGroup.size === 0) txtG.textContent = t('all');
  else if (filterGroup.size === 1) txtG.textContent = Array.from(filterGroup)[0];
  else txtG.textContent = filterGroup.size + t('selectedSuffix');
  if (filterBank.size === 0) txtB.textContent = t('all');
  else if (filterBank.size === 1) txtB.textContent = Array.from(filterBank)[0];
  else txtB.textContent = filterBank.size + t('selectedSuffix');
}
function getFilteredForStats() {
  let list = employees.filter(e => {
    const s = String(e.Situation || '').trim().toUpperCase();
    return s !== 'UNACTIVE' && s !== 'INACTIVE';
  });
  if (filterGroup.size > 0) list = list.filter(e => filterGroup.has(String(e.GroupName || '').trim()));
  if (filterBank.size > 0) list = list.filter(e => filterBank.has(String(e.SLRBankNama || e.BankNama || '').trim()));
  return list;
}
function updateFilterStats() {
  const list = getFilteredForStats();
  const count = list.length;
  const totalNet = list.reduce((sum, e) => sum + num(recalcRow({ ...e }).NetSalary), 0);
  const countEl = document.getElementById('filteredCount');
  const netEl = document.getElementById('filteredNet');
  if (countEl) countEl.textContent = count;
  if (netEl) netEl.textContent = 'RM ' + totalNet.toFixed(2);
}
function buildFilterDropdowns() {
  const groups = new Map();
  const banks = new Map();
  employees.forEach(e => {
    const s = String(e.Situation || '').trim().toUpperCase();
    if (s === 'UNACTIVE' || s === 'INACTIVE') return;
    const g = String(e.GroupName || '').trim();
    const b = String(e.SLRBankNama || e.BankNama || '').trim();
    if (g) groups.set(g, (groups.get(g) || 0) + 1);
    if (b) banks.set(b, (banks.get(b) || 0) + 1);
  });
  Array.from(filterGroup).forEach(k => { if (!groups.has(k)) filterGroup.delete(k); });
  Array.from(filterBank).forEach(k => { if (!banks.has(k)) filterBank.delete(k); });
  const listG = document.getElementById('msGroupList');
  const sortedGroups = Array.from(groups.keys()).sort();
  if (sortedGroups.length === 0) {
    listG.innerHTML = `<div class="ms-empty">${t('noOptions')}</div>`;
  } else {
    listG.innerHTML = sortedGroups.map(g => `
      <label class="ms-item">
        <input type="checkbox" data-value="${escapeHtml(g)}" ${filterGroup.has(g) ? 'checked' : ''}
               onchange="onFilterChange('group', this)">
        <span class="ms-item-name">${escapeHtml(g)}</span>
        <span class="ms-count">${groups.get(g)}</span>
      </label>`).join('');
  }
  const listB = document.getElementById('msBankList');
  const sortedBanks = Array.from(banks.keys()).sort();
  if (sortedBanks.length === 0) {
    listB.innerHTML = `<div class="ms-empty">${t('noOptions')}</div>`;
  } else {
    listB.innerHTML = sortedBanks.map(b => `
      <label class="ms-item">
        <input type="checkbox" data-value="${escapeHtml(b)}" ${filterBank.has(b) ? 'checked' : ''}
               onchange="onFilterChange('bank', this)">
        <span class="ms-item-name">${escapeHtml(b)}</span>
        <span class="ms-count">${banks.get(b)}</span>
      </label>`).join('');
  }
  updateMSLabels();
  updateFilterStats();
}

const SOCSO_TABLE = [
  [30,0.10,0.40],[50,0.20,0.70],[70,0.30,1.10],[100,0.40,1.50],
  [140,0.60,2.10],[200,0.85,2.95],[300,1.25,4.35],[400,1.75,6.15],
  [500,2.25,7.85],[600,2.75,9.65],[700,3.25,11.45],[800,3.75,13.15],
  [900,4.25,14.95],[1000,4.75,16.65],[1100,5.25,18.45],[1200,5.75,20.15],
  [1300,6.25,21.95],[1400,6.75,23.65],[1500,7.25,25.45],[1600,7.75,27.15],
  [1700,8.25,28.95],[1800,8.75,30.65],[1900,9.25,32.45],[2000,9.75,34.15],
  [2100,10.25,35.85],[2200,10.75,37.65],[2300,11.25,39.35],[2400,11.75,41.15],
  [2500,12.25,42.85],[2600,12.75,44.65],[2700,13.25,46.35],[2800,13.75,48.15],
  [2900,14.25,49.85],[3000,14.75,51.65],[3100,15.25,53.45],[3200,15.75,55.15],
  [3300,16.25,56.95],[3400,16.75,58.65],[3500,17.25,60.45],[3600,17.75,62.15],
  [3700,18.25,63.95],[3800,18.75,65.65],[3900,19.25,67.45],[4000,19.75,69.15],
  [4100,20.25,70.85],[4200,20.75,72.65],[4300,21.25,74.35],[4400,21.75,76.15],
  [4500,22.25,77.85],[4600,22.75,79.65],[4700,23.25,81.35],[4800,23.75,83.15],
  [4900,24.25,84.85],[5000,24.75,86.65],[5100,25.25,88.35],[5200,25.75,90.15],
  [5300,26.25,91.85],[5400,26.75,93.65],[5500,27.25,95.35],[5600,27.75,97.15],
  [5700,28.25,98.85],[5800,28.75,100.65],[5900,29.25,102.35],[6000,29.75,104.15]
];
function calcEPF(salary, age) {
  if (!salary || salary <= 0) return { employee: 0, employer: 0 };
  age = age || 30;
  if (age >= 60) return { employee: 0, employer: Math.ceil(salary * 0.04) };
  const erRate = salary <= 5000 ? 0.13 : 0.12;
  return { employee: Math.ceil(salary * 0.11), employer: Math.ceil(salary * erRate) };
}
function calcSOCSO(salary) {
  if (!salary || salary <= 0) return { employee: 0, employer: 0 };
  if (salary > 6000) salary = 6000;
  for (const row of SOCSO_TABLE) if (salary <= row[0]) return { employee: row[1], employer: row[2] };
  return { employee: 29.75, employer: 104.15 };
}
function calcEIS(salary) {
  if (!salary || salary <= 0) return { employee: 0, employer: 0 };
  if (salary > 6000) salary = 6000;
  let e = Math.round(salary * 0.002 * 100) / 100;
  if (e > 11.90) e = 11.90;
  return { employee: e, employer: e };
}
function calcLindung(salary) {
  if (!salary || salary <= 0) return 0;
  if (salary > 6000) salary = 6000;
  return Math.round(salary * 0.007325 * 100) / 100;
}
function isCashBank(emp) {
  const bank = String(emp.SLRBankNama || emp.BankNama || '').trim().toUpperCase();
  return bank === 'CASH' || bank.includes('MERCHANTRADE');
}
function isExempt(staff) {
  const bank = (String(staff.SLRBankNama || '') + ' ' + String(staff.BankNama || '')).toLowerCase();
  if (bank.includes('cash') || bank.includes('merchantrade')) {
    return { epf: true, socso: true, eis: true, lindung: true };
  }
  const isNo = v => String(v || '').trim().toUpperCase() === 'NO';
  return { epf: isNo(staff.EPF), socso: isNo(staff.PERKESO), eis: isNo(staff.EIS), lindung: isNo(staff.Lindungan) };
}
function totalNonStatutoryDeduction(emp) {
  return num(emp.Deduction) + num(emp.AnnualLeave) + num(emp.UnpaidLeave)
       + num(emp.SickLeave) + num(emp.HalfDays) + num(emp.Pinjaman);
}
function recalcRow(emp) {
  const basic = num(emp.Basic);
  const exempt = isExempt(emp);
  const forceZero = isCashBank(emp);
  const epfBase = contribBase(emp, 'EPFSalary', basic);
  const socsoBase = contribBase(emp, 'SOCSOSalary', basic);
  const eisBase = contribBase(emp, 'EISSalary', basic);
  const lindungBase = contribBase(emp, 'LindungSalary', basic);
  if (!emp.manualEPF || forceZero) {
    const epf = (exempt.epf || forceZero) ? { employee: 0, employer: 0 } : calcEPF(epfBase, emp.Age || 30);
    emp.EPF_Employee = epf.employee; emp.EPF_Employer = epf.employer;
  }
  if (!emp.manualSOCSO || forceZero) {
    const socso = (exempt.socso || forceZero) ? { employee: 0, employer: 0 } : calcSOCSO(socsoBase);
    emp.SOCSO_Employee = socso.employee; emp.SOCSO_Employer = socso.employer;
  }
  if (!emp.manualEIS || forceZero) {
    const eis = (exempt.eis || forceZero) ? { employee: 0, employer: 0 } : calcEIS(eisBase);
    emp.EIS_Employee = eis.employee; emp.EIS_Employer = eis.employer;
  }
  if (!emp.manual24JAM || forceZero) {
    emp.Lindung24Jam = (exempt.lindung || forceZero) ? 0 : calcLindung(lindungBase);
  }
  const ot = num(emp.NormalOT) + num(emp.RestOT) + num(emp.PublicOT) + num(emp.OtherOT);
  const gross = basic + num(emp.Allowance) + num(emp.Allowance2)
    + num(emp.Commission) + num(emp.Incentives) + ot;
  const nonStatDed = totalNonStatutoryDeduction(emp);
  const firstCalcTotal = gross - nonStatDed;
  emp.FirstCalcTotal = firstCalcTotal;
  const totalDed = nonStatDed + num(emp.EPF_Employee) + num(emp.SOCSO_Employee)
    + num(emp.EIS_Employee) + num(emp.Lindung24Jam);
  const net = gross - totalDed;
  emp.GrossPay = gross;
  emp.TotalDeduction = totalDed;
  emp.NetSalary = net;
  return emp;
}

        });
        updateFilterStats();

  applyFilters();
  buildFilterDropdowns();
  updateStickyOffsets();

function applyFilters() {
  const filters = [];
  document.querySelectorAll('.th-filter').forEach(inp => {
    const val = inp.value.trim().toLowerCase();
    if (val) filters.push({ col: Number(inp.dataset.col), val });
  });
  document.querySelectorAll('#tbody tr').forEach(row => {
    const firstCell = row.querySelector('td');
    if (!firstCell || firstCell.hasAttribute('colspan')) return;
    const cells = row.querySelectorAll('td');
    let show = true;
    for (const flt of filters) {
      const cell = cells[flt.col];
      if (!cell) continue;
      let text;
      const inp = cell.querySelector('input');
      if (inp) text = inp.value;
      else text = cell.textContent;
      if (!String(text).toLowerCase().includes(flt.val)) { show = false; break; }
    }
    row.style.display = show ? '' : 'none';
  });
}
document.addEventListener('input', e => {
  if (e.target && e.target.classList && e.target.classList.contains('th-filter')) {
    applyFilters();
  }
});

/* ============ 检查 ============ */
function checkOne(type) {
  const rows = document.querySelectorAll('#tbody tr');
  rows.forEach((row, idx) => {
    if (row.style.display === 'none') return;
    const emp = recalcRow(employees[idx]);
    if (!emp) return;
    const exempt = isExempt(emp);
    const basic = num(emp.Basic);
    let correctValue, actualField;
    if (type === 'epf') {
      const base = contribBase(emp, 'EPFSalary', basic);
      correctValue = exempt.epf ? 0 : calcEPF(base, emp.Age || 30).employee;
      actualField = 'EPF_Employee';
    } else if (type === 'socso') {
      const base = contribBase(emp, 'SOCSOSalary', basic);
      correctValue = exempt.socso ? 0 : calcSOCSO(base).employee;
      actualField = 'SOCSO_Employee';
    } else if (type === 'eis') {
      const base = contribBase(emp, 'EISSalary', basic);
      correctValue = exempt.eis ? 0 : calcEIS(base).employee;
      actualField = 'EIS_Employee';
    } else {
      const base = contribBase(emp, 'LindungSalary', basic);
      correctValue = exempt.lindung ? 0 : calcLindung(base);
      actualField = 'Lindung24Jam';
    }
    const cell = row.querySelector(`input[data-field="${actualField}"]`);
    if (!cell) return;
    const diff = Math.abs(Number(cell.value) - correctValue) > 0.01;
    cell.classList.toggle('cell-bad', diff);
    cell.classList.toggle('cell-ok', !diff);
    if (diff) cell.title = `Sepatutnya: ${correctValue.toFixed(2)}`;
  });
  toast('Semakan ' + type.toUpperCase() + ' selesai');
}
function checkAll() {
  ['epf','socso','eis','lindung'].forEach(checkOne);
  toast('Semakan selesai');
}

/* ============ 保存到 Google Sheet ============ */
async function saveToSheet() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
    toast('Sila tetapkan APPS_SCRIPT_URL dahulu!', false); return;
  }
  employees.forEach(emp => recalcRow(emp));
  const headers = getExportHeaders();
  const rows = getExportRows(true);

  try {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}
    setSyncBadge('busy', 'AutoSync: 手动推送中…');

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ headers, rows })
    });
    const result = await res.json();
    if (result.status !== 'success') throw new Error(result.message || 'Server error');

    const hhmmss = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    setSyncBadge(autoSyncEnabled ? 'ok' : '', (autoSyncEnabled ? 'AutoSync: 已同步 ' : '已手动推送 ') + hhmmss + ' (' + rows.length + ')');
    toast(t('saved') + ' (' + rows.length + ' rows)');
  } catch (err) {
    console.error(err);
    setSyncBadge('err', 'AutoSync: 同步失败 - ' + (err.message || err));
    toast(t('failed'), false);
  }
}

function parseCSVLine(line) {
  const cells = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === ',') { cells.push(cur); cur = ''; }
      else if (ch === '"') inQ = true;
      else cur += ch;
    }
  }
  cells.push(cur); return cells;
}
function parseTextFile(text) {
  const rows = []; const lines = text.split(/\r?\n/);
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    if (/^[=\-+\s]+$/.test(trimmed)) continue;
    if (trimmed.startsWith('PAYROLL REPORT')) continue;
    if (trimmed.startsWith('Total rows')) continue;
    if (trimmed.includes('|')) rows.push(trimmed.split('|').map(s => s.trim()));
    else rows.push(parseCSVLine(trimmed));
  }
  return rows;
}

async function handleImportFile(file) {
  const name = file.name.toLowerCase();
  let rows = [];
  try {
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
      if (typeof XLSX === 'undefined') { toast('SheetJS tidak dimuat', false); return; }
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data);
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    } else if (name.endsWith('.csv') || name.endsWith('.txt')) {
      const text = await file.text();
      rows = parseTextFile(text);
    } else { toast(t('importFormat'), false); return; }
    if (!rows || rows.length < 2) { toast(t('importFail'), false); return; }
    const headers = rows[0].map(h => String(h).trim());
    const idx = {};
    const WANTED = ['Situation','Code','Name','Group','Bank','Basic','Allowance','Allowance2','Deduction','Normal OT','Rest OT','Public OT','Other OT','Pinjaman','Others',
      'Annual Leave Days','Annual Leave','Unpaid Leave Days','Unpaid Leave','Sick Leave Days','Sick Leave','Half Days Leave Days','Half Days Leave',
      'Commission','Incentives','First Calculation Total','FirstCalcTotal',
      'Salary for EPF Contributions','Salary for SOCSO Contributions','Salary for EIS Contributions','Salary for 24JAM Contributions',
      'EPF (Employee)','EPF (Employer)','SOCSO (Employee)','SOCSO (Employer)','EIS (Employee)','EIS (Employer)','24JAM',
      'SLR Bank Nama','SLR Bank Account No','SLR EPF','SLR SOCSO','SLR EIS'];
    headers.forEach((h, i) => {
      const lh = h.toLowerCase();
      for (const w of WANTED) { if (lh === w.toLowerCase()) { idx[w] = i; break; } }
    });
    if (idx['Code'] === undefined) { toast('Fail mesti ada lajur "Code"', false); return; }
    const get = (row, key) => idx[key] !== undefined ? row[idx[key]] : '';
    const parseOpt = (row, key) => {
      const v = get(row, key);
      if (v === undefined || v === null || v === '') return '';
      const n = parseFloat(v);
      return isNaN(n) ? '' : n;
    };
    const imported = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.length === 0) continue;
      const code = String(get(row, 'Code') || '').trim();
      if (!code) continue;
      const sit = String(get(row, 'Situation') || 'ACTIVE').trim().toUpperCase();
      if (sit === 'UNACTIVE' || sit === 'INACTIVE') continue;
      const basic = parseFloat(get(row, 'Basic')) || 0;
      const allowanceVal = parseFloat(get(row, 'Allowance')) || parseFloat(get(row, 'Allowance2')) || 0;
      const epfSalary = parseOpt(row, 'Salary for EPF Contributions');
      const socsoSalary = parseOpt(row, 'Salary for SOCSO Contributions');
      const eisSalary = parseOpt(row, 'Salary for EIS Contributions');
      const lindungSalary = parseOpt(row, 'Salary for 24JAM Contributions');
      const epfBase = epfSalary === '' ? basic : epfSalary;
      const socsoBase = socsoSalary === '' ? basic : socsoSalary;
      const eisBase = eisSalary === '' ? basic : eisSalary;
      const lindungBase = lindungSalary === '' ? basic : lindungSalary;
      const autoEPF = calcEPF(epfBase, 30);
      const autoSOCSO = calcSOCSO(socsoBase);
      const autoEIS = calcEIS(eisBase);
      const autoLindung = calcLindung(lindungBase);
      const impEPFE = parseFloat(get(row, 'EPF (Employee)')) || 0;
      const impEPFR = parseFloat(get(row, 'EPF (Employer)')) || 0;
      const impSOCSOE = parseFloat(get(row, 'SOCSO (Employee)')) || 0;
      const impSOCSOR = parseFloat(get(row, 'SOCSO (Employer)')) || 0;
      const impEISE = parseFloat(get(row, 'EIS (Employee)')) || 0;
      const impEISR = parseFloat(get(row, 'EIS (Employer)')) || 0;
      const impLindung = parseFloat(get(row, '24JAM')) || 0;
      const slrBankNama = String(get(row, 'SLR Bank Nama') || get(row, 'Bank') || '');
      const slrBankAcc = String(get(row, 'SLR Bank Account No') || '');
      const slrEPF = String(get(row, 'SLR EPF') || '');
      const slrPERKESO = String(get(row, 'SLR SOCSO') || '');
      const slrEIS = String(get(row, 'SLR EIS') || '');
      imported.push({
        Situation: sit, Code: code, Name: String(get(row, 'Name') || ''),
        GroupName: String(get(row, 'Group') || ''), BankNama: String(get(row, 'Bank') || ''),
        Basic: basic, Allowance: 0,
        Allowance2: allowanceVal,
        Commission: parseFloat(get(row, 'Commission')) || 0,
        Incentives: parseFloat(get(row, 'Incentives')) || 0,
        EPFSalary: epfSalary, SOCSOSalary: socsoSalary, EISSalary: eisSalary, LindungSalary: lindungSalary,
        AnnualLeaveDays: parseFloat(get(row, 'Annual Leave Days')) || 0,
        AnnualLeave: parseFloat(get(row, 'Annual Leave')) || 0,
        UnpaidLeaveDays: parseFloat(get(row, 'Unpaid Leave Days')) || 0,
        UnpaidLeave: parseFloat(get(row, 'Unpaid Leave')) || 0,
        SickLeaveDays: parseFloat(get(row, 'Sick Leave Days')) || 0,
        SickLeave: parseFloat(get(row, 'Sick Leave')) || 0,
        HalfDaysDays: parseFloat(get(row, 'Half Days Leave Days')) || 0,
        HalfDays: parseFloat(get(row, 'Half Days Leave')) || 0,
        Deduction: parseFloat(get(row, 'Deduction')) || 0,
        NormalOT: parseFloat(get(row, 'Normal OT')) || 0,
        RestOT: parseFloat(get(row, 'Rest OT')) || 0,
        PublicOT: parseFloat(get(row, 'Public OT')) || 0,
        OtherOT: parseFloat(get(row, 'Other OT')) || 0,
        Pinjaman: parseFloat(get(row, 'Pinjaman')) || 0,
        Others: parseFloat(get(row, 'Others')) || 0, Age: 30,
        EPF: 'YES', PERKESO: 'YES', EIS: 'YES', Lindungan: 'YES',
        EPF_Employee: impEPFE, EPF_Employer: impEPFR,
        SOCSO_Employee: impSOCSOE, SOCSO_Employer: impSOCSOR,
        EIS_Employee: impEISE, EIS_Employer: impEISR, Lindung24Jam: impLindung,
        SLRBankNama: slrBankNama, SLRBankAccountNo: slrBankAcc,
        SLREPF: slrEPF, SLRPERKESO: slrPERKESO, SLREIS: slrEIS,
        manualEPF:   Math.abs(impEPFE - autoEPF.employee) > 0.01 || Math.abs(impEPFR - autoEPF.employer) > 0.01,
        manualSOCSO: Math.abs(impSOCSOE - autoSOCSO.employee) > 0.01 || Math.abs(impSOCSOR - autoSOCSO.employer) > 0.01,
        manualEIS:   Math.abs(impEISE - autoEIS.employee) > 0.01 || Math.abs(impEISR - autoEIS.employer) > 0.01,
        manual24JAM: Math.abs(impLindung - autoLindung) > 0.01,
        manualSLRBankNama: false, manualSLRBankAccountNo: false,
        manualSLREPF: false, manualSLRPERKESO: false, manualSLREIS: false
      });
    }
    if (!imported.length) { toast(t('importFail'), false); return; }
    employees = imported;
    filterGroup.clear();
    filterBank.clear();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}
    renderTable();
    toast(t('importSuccess').replace('{n}', imported.length));
    closeImportModal();
  } catch (err) { console.error(err); toast('Import error: ' + err.message, false); }
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\ufeff', content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportToTXT() {
  const headers = getExportHeaders();
  const rows = getExportRows();
  if (!rows.length) { toast(t('noData'), false); return; }
  const widths = headers.map((h, i) => {
    let w = String(h).length;
    rows.forEach(r => { const len = String(r[i] ?? '').length; if (len > w) w = len; });
    return Math.min(w, 28);
  });
  const pad = (v, w) => {
    let s = String(v ?? '');
    if (s.length > w) s = s.slice(0, w - 1) + '…';
    return s + ' '.repeat(Math.max(0, w - s.length));
  };
  let out = 'PAYROLL REPORT — ' + new Date().toLocaleString('ms-MY') + '\n';
  out += '='.repeat(widths.reduce((a, b) => a + b + 3, 0)) + '\n';
  out += headers.map((h, i) => pad(h, widths[i])).join(' | ') + '\n';
  out += widths.map(w => '-'.repeat(w)).join('-+-') + '\n';
  rows.forEach(r => { out += r.map((c, i) => pad(c, widths[i])).join(' | ') + '\n'; });
  out += '\nTotal rows: ' + rows.length + '\n';

function confirmBatchPrint() {
  const idxs = [];
  document.querySelectorAll('.batch-print-chk:checked').forEach(cb => idxs.push(Number(cb.value)));
  if (idxs.length === 0) { toast('请至少选择一位员工', false); return; }
  const list = idxs.map(i => recalcRow({ ...employees[i] })).filter(Boolean);
  if (!list.length) { toast('Tiada pekerja', false); return; }
  closeBatchPrintModal();
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = list.map(buildPayslip).join('');
  toast('Sedia cetak ' + list.length + ' slip');
  setTimeout(() => window.print(), 120);
}
function buildPayslip(emp) {
  const fmt = n => Number(n || 0).toFixed(2);
  const ot = num(emp.NormalOT) + num(emp.RestOT) + num(emp.PublicOT) + num(emp.OtherOT);
  const L = I18N[currentLang];
  const extraIncome = num(emp.Allowance2) + num(emp.Commission) + num(emp.Incentives);
  const onLeave = num(emp.AnnualLeave) + num(emp.UnpaidLeave) + num(emp.SickLeave) + num(emp.HalfDays);
  return `
  <div class="payslip">
    <div class="ps-header">
      <div>
        <div class="ps-title">SLIP GAJI</div>
        <div class="ps-info">
          ${emp.GroupName || ''}<br>${emp.Name || ''}<br>${emp.IC || ''} &nbsp;|&nbsp; ${emp.Jawatan || ''}<br>${emp.SLRBankNama || emp.BankNama || ''}
        </div>
      </div>
      <div class="ps-info" style="text-align:right;"><strong>${emp.Code}</strong><br>${new Date().toLocaleDateString('ms-MY')}</div>
    </div>
    <div class="ps-cols">
      <div class="ps-section">
        <h4>PENDAPATAN</h4>
        <div class="ps-row"><span>${L.basic}</span><span>${fmt(emp.Basic)}</span></div>
        ${extraIncome > 0 ? `<div class="ps-row"><span>${L.allowance2} / ${L.commission} / ${L.incentives}</span><span>${fmt(extraIncome)}</span></div>` : ''}
        <div class="ps-row"><span>OT</span><span>${fmt(ot)}</span></div>
        <div class="ps-row total"><span>${L.gross}</span><span>${fmt(emp.GrossPay)}</span></div>
        <div class="ps-row" style="font-size:9pt;color:#666;"><span>${L.firstCalcTotal}</span><span>${fmt(emp.FirstCalcTotal)}</span></div>
      </div>
      <div class="ps-section">
        <h4>POTONGAN</h4>
        ${onLeave > 0 ? `<div class="ps-row"><span>On Leave</span><span>${fmt(onLeave)}</span></div>` : ''}
        <div class="ps-row"><span>${L.pinjaman}</span><span>${fmt(emp.Pinjaman)}</span></div>
        <div class="ps-row"><span>EPF</span><span>${fmt(emp.EPF_Employee)}</span></div>
        <div class="ps-row"><span>SOCSO</span><span>${fmt(emp.SOCSO_Employee)}</span></div>
        <div class="ps-row"><span>EIS</span><span>${fmt(emp.EIS_Employee)}</span></div>
        <div class="ps-row"><span>${L.lindung}</span><span>${fmt(emp.Lindung24Jam)}</span></div>
        <div class="ps-row total"><span>${L.totalDed}</span><span>${fmt(emp.TotalDeduction)}</span></div>
      </div>
    </div>
    <div class="ps-section" style="margin-top:5mm;">
      <div class="ps-row total" style="font-size:12pt;"><span>${L.net}</span><span>RM ${fmt(emp.NetSalary)}</span></div>
    </div>
    <div class="ps-section">
      <h4>SUMBANGAN MAJIKAN (tidak ditolak)</h4>
      <div class="ps-cols">
        <div>
          <div class="ps-row"><span>EPF (Majikan)</span><span>${fmt(emp.EPF_Employer)}</span></div>
          <div class="ps-row"><span>SOCSO (Majikan)</span><span>${fmt(emp.SOCSO_Employer)}</span></div>
          <div class="ps-row"><span>EIS (Majikan)</span><span>${fmt(emp.EIS_Employer)}</span></div>
        </div>
      </div>
    </div>
    <div class="ps-sign"><div>Pekerja</div><div>Majikan</div></div>
  </div>`;
}

function switchLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  renderTable();
  setTimeout(updateStickyOffsets, 60);
}

/* ============================================================
   初始化
   ============================================================ */
window.addEventListener('DOMContentLoaded', async () => {
  const langSelect = document.getElementById('langSelect');
  if (langSelect) langSelect.value = currentLang;
  syncNavHeight();

  const toggle = document.getElementById('autoSyncToggle');
  if (toggle) toggle.checked = false;
  autoSyncEnabled = false;
  setSyncBadge('', 'AutoSync: 手动模式');

  // 先从 localStorage 恢复
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      const parsed = JSON.parse(stored);
      if (Array.isArray(parsed) && parsed.length > 0) {
        employees = parsed.map(e => ({
          ...e,
          Situation: String(e.Situation || 'ACTIVE').trim().toUpperCase()
        })).filter(e => e.Situation !== 'UNACTIVE' && e.Situation !== 'INACTIVE');
        renderTable();
      }
    }
  } catch (e) { console.error('localStorage load failed', e); }

  // ✅ 优先从 STAFF LOGIN RECORD 拉取基础资料（覆盖本地）
  await loadStaffBasics();

  updateStickyOffsets();
  setTimeout(updateStickyOffsets, 200);
  setTimeout(updateStickyOffsets, 600);
  setTimeout(syncNavHeight, 300);
});

window.addEventListener('beforeunload', () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); } catch (e) {}
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    updateStickyOffsets();
    syncNavHeight();
  }, 100);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { updateStickyOffsets(); syncNavHeight(); });
}
</script>
